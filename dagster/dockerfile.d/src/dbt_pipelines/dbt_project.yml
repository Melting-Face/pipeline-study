# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: "dbt_pipelines"
version: "1.0.0"

# This setting configures which "profile" dbt uses for this project.
profile: "dbt_pipelines"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  dbt_pipelines:
    # bronze layer 리셋됨: 기존 example 모델 제거.
    # 새 모델은 models/<dataset>/ 하위에 추가한다(데이터셋별 subproject).
    # Dagster group은 translator 서브클래싱 대신 dbt config로 선언한다(프로젝트 컨벤션).
    # 기본 DagsterDbtTranslator가 meta.dagster.group을 읽어 모델 자산의 그룹을 매긴다.
    +meta:
      dagster:
        group: dbt_ingest
    # 데이터셋별 출력 스키마 = Iceberg 네임스페이스(bronze와 동일 네임스페이스).
    # generate_schema_name 오버라이드로 target schema(dev/prod) 접두어 없이 그대로 적재된다.
    # 메달리온 레이어는 스키마 접두어가 아니라 tag/kind로 표기한다.
    eicu:
      +schema: eicu
    # 주식예측 silver. 🔴 **group을 재정의한다** — 전역 기본값
    # `meta.dagster.group: dbt_ingest`를 그대로 두면 `automation.py`의
    # `dbt_all_job`(= `AssetSelection.groups("dbt_ingest")`)이 **매시각 이 모델까지
    # 끌고 간다.** 이 모델들은 전용 잡이 소유한다.
    stock_forecast:
      +schema: stock_forecast
      +meta:
        dagster:
          group: stock_forecast_silver
      tables:
        +materialized: table
        # 이유는 아래 mimic_iv.tables의 on_table_exists 주석과 같다
        +on_table_exists: replace
        +file_format: iceberg
    mimic_iv:
      +schema: mimiciv
      # 실버 모델은 물리 테이블로 구체화한다(dbt 기본값 view 재정의).
      # 레이어는 각 모델의 config(tags=['silver'])로 표기한다.
      tables:
        +materialized: table
        # dbt-spark에서 이 줄이 없으면 22모델이 매 실행 DROP+CREATE로 돌아
        # Iceberg 스냅샷 히스토리가 소멸하고, schema.yml의 컬럼 description이
        # 에러 없이 통째로 무시된다(dbt-spark adapters.sql의 persist_docs 분기가
        # file_format in ['delta','hudi','iceberg']일 때만 ALTER TABLE을 발행).
        # dbt-trino는 file_format을 무시한다 — Trino에서 같은 위험을 막는 것은 아래
        # on_table_exists다.
        +file_format: iceberg
        # 🔴 dbt-trino 기본값 `rename`은 테이블이 있으면 `__dbt_tmp`를 새로 만들어
        #    rename으로 바꿔 끼운다(dbt-trino 1.10.6 table.sql) → 매 실행 **새 테이블**이라
        #    스냅샷 이력이 1로 리셋되고 location이 바뀐다. `replace`는 CREATE OR REPLACE라
        #    location·스냅샷 이력이 유지된다(Trino 483 실측: rename 1→1·location 변경 /
        #    replace 1→3·location 불변). ⚠️ 단 replace 스냅샷은 parent_id가 없는 독립
        #    루트라 계보는 선형이 아니다(Spark createOrReplace와 같은 모양) — 이 테이블들을
        #    증분 읽기 소스로 쓰지 않는다(common/helper.py 경고).
        +on_table_exists: replace
