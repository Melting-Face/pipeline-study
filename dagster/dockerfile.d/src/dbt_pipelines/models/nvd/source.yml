# NVD silver의 원천 — bronze 세 테이블(적재 소유자 Airflow DAG, 테이블마다 아래 주석).
#
# 적재와 모델 빌드 모두 Airflow가 소유한다 — bronze는 DAG `nvd_cves`·`nvd_cve_history`·`nvd_kev`가
# 적재하고, 이 디렉터리의 모델은 DAG `nvd_dbt`(Cosmos)가 빌드한다. 적재 DAG의 outlet이
# `nvd_dbt`를 트리거한다. 그래서 Dagster 자산키 매핑(`meta.dagster.asset_key`)은 두지 않는다
# (docs/conventions/airflow.md 컷오버).
#
# - schema    : Iceberg 네임스페이스 nvd.
version: 2

sources:
  - name: nvd
    description: "NVD CVE·Change History·CISA KEV bronze. Airflow DAG가 적재."
    schema: nvd
    tables:
      # 적재 소유자: Airflow DAG nvd_cves (images/airflow/dags/).
      - name: nvd_cves
        description: >-
          CVE 레코드 버전 이력. 파티션 키 window_date(= lastModified의 UTC 하루).
          같은 cve_id가 수정될 때마다 다른 파티션에 한 행 더 쌓인다 — 최신 1행 접기는 silver.
      # 적재 소유자: Airflow DAG nvd_cve_history (images/airflow/dags/).
      - name: nvd_cve_history
        description: >-
          CVE 변경 이벤트. 파티션 키 window_date(= created의 UTC 하루).
          raw_json에 details 배열이 있다.
      # 적재 소유자: Airflow DAG nvd_kev (images/airflow/dags/).
      - name: nvd_kev
        description: >-
          CISA KEV 카탈로그 최신 스냅샷(테이블 전체 교체). 스칼라가 이미 타입이 맞아
          silver 모델을 두지 않고 gold가 이 source를 직접 읽는다.
