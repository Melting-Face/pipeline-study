# dbt-trino 프로파일: k8s Trino를 통해 Iceberg(JDBC 카탈로그) 레이크하우스에 적재
# database = Trino 카탈로그명(gitops/apps/trino/values.yaml의 catalog-name과 일치), schema = Trino 스키마
#
# 접속 대상은 k8s Trino(Ingress `trino.localtest.me:8080`)다. 바꿀 때는 `TRINO_HOST`·`TRINO_PORT`를
# env로 **한 벌**로 바꾼다. Dagster `TrinoResource`(common/constants.py)도 같은 env를 읽는다.
#
# Spark 타깃(spark_session·spark_connect·spark_thrift)은 Spark Connect·Thrift 철거와 함께 걷어냈다.
# 🔴 Spark 시절 결과와의 **값 대조는 하지 않았다(미대조)** — docs/architectures/trino.md.
dbt_pipelines:
  outputs:
    dev:
      type: trino
      method: none # dev 환경: 인증 없음
      user: dagster
      host: "{{ env_var('TRINO_HOST', 'trino.localtest.me') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | as_number }}"
      http_scheme: http
      database: iceberg # Trino 카탈로그 (= catalog-name)
      schema: dev # Trino 스키마 (없으면 dbt가 생성)
      threads: 4

    prod:
      type: trino
      method: none
      user: dagster
      host: "{{ env_var('TRINO_HOST', 'trino.localtest.me') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | as_number }}"
      http_scheme: http
      database: iceberg
      schema: prod
      threads: 8

  # 기본 타깃은 여기 한 곳만 정본으로 둔다 — Dagster(@dbt_assets)·수동 CLI가
  # 모두 같은 답을 본다. `dbt.cli([..., "--target", ...])`로 코드에 박지 않는 이유는
  # Dagster와 수동 CLI의 진입점이 갈리기 때문이다.
  #   ⚠️ `trino`라는 이름의 타깃은 없다 — 아래 outputs에 실재하는 이름만 쓴다: dev · prod
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
