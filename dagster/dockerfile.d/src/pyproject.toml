[project]
name = "dagster_project"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
  "beautifulsoup4==4.13.3",
  "requests==2.32.5",
  "xlsx2csv==0.8.4",
  "openpyxl==3.1.5",
  "s3fs==2026.1.0",
  "dagster==1.12.12",
  "dagster-webserver==1.12.12",
  "dagster-graphql==1.12.12",
  "dagster-postgres==0.28.12",
  "dagster-dbt==0.28.12",
  # DuckDB 대체: Trino 어댑터 (버전은 dbt-core 1.10 호환성 빌드 시 재확인 필요)
  # Phase 1 이행 중: dbt-spark로 옮기는 동안 두 어댑터를 **동시 설치**해 타깃만 바꿔가며 대조한다.
  # 이행 완료 시 제거한다(docs/redesign.md Phase 1).
  "dbt-trino>=1.8,<2.0",
  # Spark 어댑터 — `session` extra는 pyspark를 동반해 SparkSession으로 붙는다.
  # 2026-08-19 실측으로 **Spark Connect 서버 구동을 엔드투엔드 확인**했다(dbt debug/build/merge/
  # docs generate/22모델 compile 전부 통과) → Thrift 서버 없이 성립한다(docs/architectures/spark.md).
  #
  # 🔴 **상한을 minor로 좁힌 이유**: 이 경로는 dbt-spark가 **공식 지원하지 않는다**.
  #   `dbt/adapters/spark/connections.py`의 `SparkConnectionMethod`는 thrift/http/odbc/session
  #   4개뿐이고 connect가 없다. 동작하는 이유는 `session.py`가 `builder.config(k, v)` →
  #   `getOrCreate()`를 타서, pyspark classic 빌더가 `spark.remote`를 보고 RemoteSparkSession으로
  #   위임하는 **내부 동작**에 얹히기 때문이다. 즉 계약이 아니라 구현에 의존한다 →
  #   **minor 업그레이드가 조용히 깨뜨릴 수 있다.** 상한을 올릴 때는 반드시
  #   `scripts/spark_connect_smoke.py`를 통과시킨 뒤 올린다(docs/test.md §5-1).
  "dbt-spark[session]>=1.11,<1.12",
  # pyspark는 **클러스터 러너 이미지와 같은 계열로 고정**한다(현재 Spark 3.5.9).
  # 기본 해석은 4.x를 끌어오는데, Iceberg 런타임 jar(1.6.1 = Spark 3.5용)와 방언이 어긋난다.
  # `connect` extra(gRPC 클라이언트)까지 받아야 dbt-spark가 `spark.remote`로 붙는다.
  # 상한이 `<3.6`인 이유는 위 dbt-spark와 같다 — `spark.remote` 위임은 pyspark 내부 동작이라
  # 버전 계약이 없다. 러너 이미지(3.5.9)와의 계열 일치도 함께 지킨다.
  "pyspark[connect]>=3.5.9,<3.6",
  # Trino 파이썬 클라이언트 — Iceberg 유지보수 프로시저 실행(common/trino.py)에 직접 사용.
  # dbt-trino 전이 의존이나, 직접 import하므로 명시 선언(explicit dependencies).
  "trino>=0.330",
  "dagster-dg-cli==1.12.12",
  # Spark 리소스 — Iceberg 유지보수 프로시저를 Spark Connect로 실행(defs/maintenance.py).
  # `LazyPySparkResource(spark_config={"spark.remote": ...})`로 Connect에 붙는다(2026-08-19 실측:
  # 내부 `builder.config(k,v)`가 spark.remote를 받아 pyspark.sql.connect 세션을 만든다).
  # 전이로 `dagster-spark`(spark-submit 래퍼)가 따라오지만 직접 쓰지 않는다 — 설정 스키마 제공용.
  "dagster-pyspark==0.28.12",
  # S3(SeaweedFS)·Iceberg 리소스
  "dagster-aws==0.28.12",
  # dagster-iceberg(preview)가 pyiceberg[pyarrow]를 동반 설치 → pyarrow는 전이 의존으로 해결
  "dagster-iceberg==0.3.14",
  "kubernetes>=36.0.3",
]

[dependency-groups]
dev = [
  "dagster-webserver",
  "pytest",
  "ruff",
  "sqlfluff",
  "sqlfluff-templater-dbt",
  "gitlint",
  "yamllint",
  "mypy",
]
# 호스트 탐색용 노트북(옵션). 런타임(`[project].dependencies`)은 건드리지 않는다 —
# 이미지·daemon에는 들어가지 않고, 필요할 때만 `--group notebook`으로 켠다.
#
# 이 그룹을 **런타임과 같은 venv**에 두는 이유: Spark Connect(pyspark)·pyiceberg·pandas·pyarrow가
# 전부 여기 이미 있어 커널 하나로 레이크하우스에 붙고, `dagster_project.common.*` 적재 헬퍼를
# 노트북에서 그대로 import해 **에셋과 같은 코드로** 검증할 수 있다.
#   uv run --group notebook jupyter lab --port 8889
# (8888은 compose SeaweedFS filer UI가 게시하므로 피한다.)
notebook = [
  "jupyterlab>=4.2,<5",
  # jupyterlab 전이 의존이나 커널을 직접 등록하므로 명시 선언
  "ipykernel>=6.29,<7",
  # pyspark/pyiceberg 전이로 이미 설치되나 노트북에서 직접 import하므로 명시 선언
  "pandas>=2.2",
  # 전이 의존으로만 설치되나 노트북에서 직접 import하므로 명시 선언
  # (`from dotenv import load_dotenv` — 상류가 이 의존을 떨구면 조용히 깨진다)
  "python-dotenv>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_project"
registry_modules = ["dagster_project.components.*"]

# 린트·포맷·타입체크 도구(ruff·sqlfluff·mypy) 설정은 repo 루트 pyproject.toml로 이전했다.
# 이 파일은 패키징(`[project]`·`[build-system]`)과 Dagster `dg` 설정만 둔다.
