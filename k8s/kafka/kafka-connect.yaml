# Kafka Connect + Iceberg Sink (학습 PoC — Strimzi 1.3.0 / Iceberg 1.11.0)
#
# 토픽 `poc-events`(JSON, 스키마 없음) → Iceberg 테이블 `iceberg.kafka_poc.events`.
# 🔴 대상은 **전용 namespace `kafka_poc`** 다. 정본 bronze/silver 테이블에 쓰지 않는다 — 회수(DROP)가 이 namespace에 갇힌다.
#
# 카탈로그 배선은 Flink(`k8s/flink/iceberg-catalog-init.yaml`)와 같은 값이다.
#   - 카탈로그 이름 `iceberg` — JDBC 카탈로그는 catalog_name으로 레지스트리를 분할한다(k8s.md §11).
#     다르면 같은 DB를 봐도 Spark에서 이 테이블이 **안 보인다**(에러 없음).
#   - 비밀정보는 CR에 쓰지 않는다. 컨테이너 env(secretKeyRef)로 넣고 커넥터 설정은 `${env:...}`로 참조한다
#     (Kafka `EnvVarConfigProvider`). 🔴 이 provider 경로는 Strimzi 문서로 확인하지 못했다(미확인) —
#     커넥터가 `${env:PG_USER}`를 문자 그대로 받으면 JDBC 인증 실패로 드러난다.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
    name: connect-poc
    namespace: default
    annotations:
        # KafkaConnector CR로 커넥터를 관리한다(REST 직접 호출 대신 선언형).
        strimzi.io/use-connector-resources: "true"
spec:
    version: 4.3.1
    replicas: 1
    image: localhost:5001/connect-runner:0.1.0
    bootstrapServers: kafka-poc-kafka-bootstrap:9092
    config:
        group.id: connect-poc
        config.storage.topic: connect-poc-configs
        offset.storage.topic: connect-poc-offsets
        status.storage.topic: connect-poc-status
        # 단일 노드라 1. -1(브로커 기본값)도 kafka-kraft.yaml의 default.replication.factor=1로 같아지지만
        # 두 파일에 걸친 암묵 결합이 되므로 명시한다.
        config.storage.replication.factor: 1
        offset.storage.replication.factor: 1
        status.storage.replication.factor: 1
        config.providers: env
        config.providers.env.class: org.apache.kafka.common.config.provider.EnvVarConfigProvider
    resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {cpu: 1000m, memory: 1Gi}
    jvmOptions:
        "-Xms": 512m
        "-Xmx": 512m
    template:
        connectContainer:
            env:
                - name: PG_USER
                  valueFrom:
                      secretKeyRef: {name: catalog-pg-app, key: username}
                - name: PG_PASSWORD
                  valueFrom:
                      secretKeyRef: {name: catalog-pg-app, key: password}
                # S3FileIO는 AWS 기본 자격증명 체인을 탄다 — 표준 env 이름으로 넣어 설정에서 키를 뺀다.
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                      secretKeyRef: {name: lakehouse-creds, key: s3-access-key}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                      secretKeyRef: {name: lakehouse-creds, key: s3-secret-key}
                - name: AWS_REGION
                  value: us-east-1
                # 🔴 SeaweedFS는 SDK v2의 aws-chunked 프레이밍을 못 풀어 객체가 **조용히 손상**된다 — Java도 해당(k8s/checksum.md).
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: when_required
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
    name: iceberg-sink-poc
    namespace: default
    labels:
        strimzi.io/cluster: connect-poc
spec:
    class: org.apache.iceberg.connect.IcebergSinkConnector
    tasksMax: 1
    config:
        topics: poc-events
        key.converter: org.apache.kafka.connect.storage.StringConverter
        value.converter: org.apache.kafka.connect.json.JsonConverter
        value.converter.schemas.enable: false
        iceberg.tables: kafka_poc.events
        # 🔴 미확인 키 — 테이블 자동 생성. 안 먹으면 창 전에 Spark로 테이블을 먼저 만든다(README §사전 조건).
        iceberg.tables.auto-create-enabled: true
        iceberg.control.topic: control-iceberg
        # PoC는 기다림을 줄이려 30초로 둔다(기본 300,000ms = 5분, 1.11.0 문서).
        iceberg.control.commit.interval-ms: 30000
        # 🔴 미확인 키 — 카탈로그 이름. 판정은 README §검증의 Spark 조회로만 한다(이름이 어긋나면 count가 아니라 「없음」이 나온다).
        iceberg.catalog: iceberg
        iceberg.catalog.catalog-impl: org.apache.iceberg.jdbc.JdbcCatalog
        iceberg.catalog.uri: jdbc:postgresql://catalog-postgres-rw:5432/iceberg
        iceberg.catalog.jdbc.user: ${env:PG_USER}
        iceberg.catalog.jdbc.password: ${env:PG_PASSWORD}
        iceberg.catalog.warehouse: s3://warehouse
        iceberg.catalog.io-impl: org.apache.iceberg.aws.s3.S3FileIO
        iceberg.catalog.s3.endpoint: http://seaweedfs:8333
        iceberg.catalog.s3.path-style-access: true
