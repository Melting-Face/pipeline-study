# FlinkDeployment(세션 클러스터) — Iceberg 카탈로그 공유용 상시 클러스터
#
# `spec.job`이 없으면 **세션 클러스터**다: JobManager가 상주하므로 Web UI(8081)가 계속 살아 있고,
# 잡은 나중에 붙인다. Spark의 driver UI가 잡 종료와 함께 사라지는 것과 대비된다
# (docs/architectures/flink.md).
#
# 버전 짝맞춤(2026-08-18 실측): `iceberg-flink-runtime`은 **Flink 2.1까지만** 존재한다(2.2는 404).
#   오퍼레이터 CRD가 `v2_2`를 받아줘도 Iceberg가 없으면 무의미하므로 **v2_1**로 맞춘다.
#   이미지는 Iceberg 런타임을 구운 `flink-runner`(k8s/flink/Dockerfile.flink-runner).
#
# 크리덴셜은 Secret→env로만 주입한다(매니페스트 평문 금지, conventions/k8s.md §4).
# Flink SQL DDL은 env를 보간하지 못하므로, SQL 파일을 셸에서 생성할 때 확장해 쓴다.
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
    name: flink-session
    namespace: default
spec:
    image: localhost:5001/flink-runner:0.3.0
    imagePullPolicy: Always
    flinkVersion: v2_1
    serviceAccount: flink
    # Web UI를 고정 URL로 노출한다(port-forward 대체). 오퍼레이터가 Ingress를 직접 만든다.
    # `localtest.me`는 공개 DNS가 127.0.0.1로 응답하므로 /etc/hosts 수정이 필요 없다.
    # 호스트 포트는 kind extraPortMappings에 따라 8080 → http://flink.localtest.me:8080
    ingress:
        template: "flink.localtest.me"
        className: "nginx"

    flinkConfiguration:
        # TM 1개 × 2슬롯 (docs/resource-sizing.md "STREAM(일시)" 배분)
        taskmanager.numberOfTaskSlots: "2"

        # ── 체크포인트/상태 (Phase A-2 스트리밍) ──────────────────────────────
        # 10s인 이유: 시연 창이 수 분이라 그 안에 체크포인트가 **여러 번 돌아 관측 가능**해야 한다.
        #   더 길면 회수 전에 한 번도 안 돌아 "설정했는데 증거가 없는" 상태가 되고,
        #   더 짧으면 12행짜리 PoC 대비 오버헤드만 커진다. 운영값이 아니라 **관측용 값**이다.
        execution.checkpointing.interval: "10s"
        execution.checkpointing.mode: "EXACTLY_ONCE"
        state.backend.type: "rocksdb"
        # 🔴 디렉터리 키는 Flink 2.x **정본 이름**을 쓴다.
        #   `state.checkpoints.dir`·`state.savepoints.dir`도 2.1.3에서 아직 동작하지만
        #   **deprecated 별칭**이다(2026-08-23 CheckpointingOptions 상수풀 실측 —
        #   primary=`execution.checkpointing.dir`, 별칭=`state.checkpoints.dir`·`state.backend.fs.checkpointdir`).
        execution.checkpointing.dir: "s3://warehouse/flink-checkpoints"
        execution.checkpointing.savepoint-dir: "s3://warehouse/flink-savepoints"
        # 🔴 storage를 명시하지 않으면 기본이 **JobManager 메모리**다 — dir만 주면 메타데이터만 S3로 나가고
        #   실제 상태는 JM 메모리에 남을 수 있다. "경로는 살아 있는데 볼 것이 없다"를 막으려고 못 박는다.
        execution.checkpointing.storage: "filesystem"

        # ── 체크포인트 경로용 S3 (Iceberg S3FileIO와 다른 계층) ────────────────
        # Flink의 `s3.*`는 flink-s3-fs-hadoop이 `fs.s3a.*`로 미러링한다
        # (S3FileSystemFactory 실측: 미러 접두어 `s3.`·`s3a.`·`fs.s3a.` → `fs.s3a.`).
        s3.endpoint: "http://seaweedfs:8333"
        s3.path.style.access: "true"
        # 🔴 `s3.access-key`/`s3.secret-key`가 없는 것은 **빠뜨린 게 아니라 의도**다.
        #   파드에 AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY가 Secret→env로 이미 들어가고(아래 podTemplate),
        #   S3A 기본 자격증명 체인의 EnvironmentVariableCredentialsProvider가 그것을 집어간다.
        #   매니페스트에 키를 적으면 평문 커밋이 된다(conventions/k8s.md §4 — 크리덴셜은 Secret→env).
        # 🔴 미확인 — 체크섬: flink-s3-fs-hadoop-2.1.3.jar를 열어보면 `com/amazonaws/*` 3887개,
        #   `software/amazon/awssdk/*` **0개** ⇒ 번들 SDK는 **v1**, Hadoop은 3.3.4(2026-08-23 실측).
        #   SeaweedFS의 aws-chunked 결함은 **SDK v2 기본 동작**이라 이 경로에는 해당하지 않을 것으로 보인다
        #   (docs/architectures/spark.md §SeaweedFS 체크섬 결함). 단 파드의
        #   AWS_REQUEST_CHECKSUM_CALCULATION은 v1이 **모르는 변수라 무시**되므로 "덮어서 안전"이 아니라
        #   "애초에 무관"이다 — 즉 안전 근거는 SDK 버전 하나뿐이다.
        #   ⇒ 체크포인트 파일이 실제로 온전한지는 **실행으로 확인해야 한다**(현재 미확인).
    podTemplate:
        spec:
            containers:
                - name: flink-main-container
                  env:
                      # CNPG가 만드는 쓰기 서비스(`-rw`). 읽기 전용은 `-ro`.
                      - name: ICEBERG_JDBC_URI
                        value: "jdbc:postgresql://catalog-postgres-rw:5432/iceberg"
                      - name: ICEBERG_WAREHOUSE
                        value: "s3://warehouse"
                      - name: S3_ENDPOINT
                        value: "http://seaweedfs:8333"
                      # AWS SDK v2는 region이 있어야 클라이언트가 뜬다(SeaweedFS는 무시)
                      - name: AWS_REGION
                        value: "us-east-1"
                      # 🔴 SeaweedFS는 AWS SDK v2의 aws-chunked 프레이밍을 풀지 못해 객체가 조용히 손상된다.
                      #   flink-runner도 Iceberg 1.11.0(S3FileIO → SDK v2)이라 spark-connect와 동일하게 필요하다.
                      #   2026-08-21 실측 — spark-connect에서 1.11.0 배포 후 PUT 객체가 chunk 프레이밍인 채 저장됨.
                      - name: AWS_REQUEST_CHECKSUM_CALCULATION
                        value: "when_required"
                      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                        value: "when_required"
                      # S3 키는 **DDL에 쓰지 않는다** — sql-client가 실행문을 그대로 echo해
                      # 로그·터미널에 평문이 남는다(2026-08-18 실측). S3FileIO는 AWS 기본
                      # 자격증명 체인을 타므로 표준 env 이름으로 넣으면 DDL에서 뺄 수 있다.
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom:
                            secretKeyRef: {name: lakehouse-creds, key: s3-access-key}
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom:
                            secretKeyRef: {name: lakehouse-creds, key: s3-secret-key}
                      # PG 크리덴셜은 CNPG bootstrap 시크릿(basic-auth라 키 이름이 username/password 고정)
                      - name: PG_USER
                        valueFrom:
                            secretKeyRef: {name: catalog-pg-app, key: username}
                      - name: PG_PASSWORD
                        valueFrom:
                            secretKeyRef: {name: catalog-pg-app, key: password}
                      - name: S3_ACCESS_KEY
                        valueFrom:
                            secretKeyRef: {name: lakehouse-creds, key: s3-access-key}
                      - name: S3_SECRET_KEY
                        valueFrom:
                            secretKeyRef: {name: lakehouse-creds, key: s3-secret-key}
                  # Flink SQL 잡 파일(배치=k8s/flink/iceberg-batch-job.yaml,
                  #                    스트림=k8s/flink/iceberg-stream-job.yaml).
                  # 🔴 이 마운트는 참조 대상 ConfigMap이 **둘 다 먼저 존재해야** 한다 —
                  #   하나라도 없으면 파드가 CreateContainerConfigError로 뜨지 않는다.
                  #   그래서 ConfigMap을 만든 뒤에야 이 블록을 넣었다(배치 2026-08-21, 스트림 2026-08-23).
                  #   ⇒ apply 순서는 **ConfigMap 2종 → FlinkDeployment**로 고정이다.
                  # 마운트 경로를 나눈 이유: 한 경로에 ConfigMap 2개를 겹쳐 마운트하면 뒤엣것이 앞엣것을
                  #   가린다(파일 단위 병합이 아니다). 배치=/opt/flink/sql, 스트림=/opt/flink/sql-stream.
                  volumeMounts:
                      - name: iceberg-batch-job
                        mountPath: /opt/flink/sql
                        readOnly: true
                      - name: iceberg-stream-job
                        mountPath: /opt/flink/sql-stream
                        readOnly: true
            volumes:
                - name: iceberg-batch-job
                  configMap:
                      name: iceberg-batch-job
                - name: iceberg-stream-job
                  configMap:
                      name: iceberg-stream-job
    jobManager:
        resource:
            memory: "2048m"
            cpu: 1
    taskManager:
        resource:
            memory: "2048m"
            cpu: 1
