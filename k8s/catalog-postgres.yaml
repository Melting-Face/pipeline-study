# Iceberg JDBC 카탈로그 Postgres — **CloudNativePG(CNPG) 오퍼레이터** 관리
#
# 이전 구성은 `Deployment` + `emptyDir`였다 → 파드 재기동 시 카탈로그(테이블 메타)가 **전부 소멸**했다.
# S3의 parquet은 남지만 "테이블"이 사라져 복구 = 재적재이므로, 상태 저장 규칙
# (docs/conventions/k8s.md §1 StatefulSet+PVC)을 오퍼레이터로 충족한다.
#
# 오퍼레이터 설치: scripts/k8s-operators.sh · 크리덴셜 시크릿 생성: scripts/k8s-poc-storage.sh
# 서비스 이름은 CNPG가 만든다 → **catalog-postgres-rw**(쓰기)·`-ro`(읽기 전용)·`-r`(전체).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
    name: catalog-postgres
    namespace: default
spec:
    # PoC는 단일 인스턴스. HA(2+)는 상주 예산과 함께 판단한다(docs/resource-sizing.md §B).
    instances: 1
    # 이미지 태그 고정(§4 `latest` 금지). CNPG 1.30.0의 기본 operand는 `18.6-system-trixie`지만
    # system 타입은 deprecated이고, 백업은 in-tree가 아닌 **Barman Cloud 플러그인**으로 가므로
    # 이미지에 barman 바이너리가 필요 없다 → `standard`.
    # 태그 형식 `MM.mm-TYPE-OS`: https://github.com/cloudnative-pg/postgres-containers
    imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
    bootstrap:
        initdb:
            database: iceberg
            owner: iceberg
            # 🔴 CNPG **자동생성** 시크릿(`catalog-postgres-app`)을 쓰지 않고 선언 시크릿을 지정한다.
            # Dagster·dbt·Spark·Flink가 이 DB에 직접 붙기 때문이다(`ICEBERG_CATALOG_*`).
            # 오퍼레이터가 비밀번호를 만들면 사람이 `kubectl get secret`으로 꺼내 `.env`에 옮겨야 하고,
            # 그 동기화가 어긋나면 "나열은 되는데 접속에서 죽는" 부분 성공 드리프트가 재현된다
            # (CLAUDE.md 운영 §"접속 대상을 바꾸는 값은 한 벌로 묶어 바꾼다").
            # 비밀정보 단일 출처는 scripts/k8s-poc-storage.sh(env override).
            secret:
                name: catalog-pg-app
    # superuser 접근은 기본 비활성(CNPG). 카탈로그는 DB owner 권한만으로 충분하다
    # (owner=iceberg라 PG15+ 이후에도 public 스키마에 CREATE 가능).
    enableSuperuserAccess: false
    # 🔴 `bootstrap.initdb`는 **초기화 1회**라 시크릿을 바꿔도 DB 롤에 반영되지 않는다
    # (Secret만 바뀌고 롤은 옛 값 → "성공한 것처럼 보이는" 드리프트. 2026-08-19 감사 지적).
    # `managed.roles`로 선언하면 CNPG가 **시크릿 변경을 감지해 롤에 재적용**한다.
    # 이름은 initdb의 owner와 같아야 한다(같은 롤을 인수해 관리하는 것이다).
    managed:
        roles:
            - name: iceberg
              ensure: present
              login: true
              comment: Iceberg JDBC 카탈로그 소유자 (bootstrap.initdb에서 생성 후 선언 관리로 인수)
              passwordSecret:
                  name: catalog-pg-app
            # Dagster 메타 스토리지(run·event log·schedule) 소유자.
            # 🔴 `iceberg` 롤을 재사용하지 않는다 — 크리덴셜 하나의 폭발반경을 두 배로 만들고,
            # "같은 비밀번호를 두 시크릿에 두지 않는다"는 규율의 정반대가 된다.
            # 이 롤이 소유하는 DB 선언은 **k8s/dagster/dagster-meta-db.yaml**에 있다(한 벌).
            # bootstrap을 거치지 않고 처음부터 선언 관리라 회전 경로가 깨끗하다.
            - name: dagster
              ensure: present
              login: true
              comment: Dagster 메타 스토리지 소유자 (선언 관리 — bootstrap 경유 아님)
              passwordSecret:
                  name: dagster-meta-pg-app
    # 🚧 백업·PITR(Barman Cloud 플러그인)은 **아직 배선하지 않는다.**
    # 2026-08-19 실측: 플러그인·ObjectStore까지는 떴으나 **SeaweedFS로의 `PutObject`가
    # `InternalError`(max retries 4)로 실패**해 WAL 아카이빙이 무한 재시도에 빠졌다
    # (`ContinuousArchiving=False`, `barman-cloud-wal-archive: exit status 4`).
    # aws-chunked 체크섬 가설로 사이드카에 `AWS_REQUEST_CHECKSUM_CALCULATION=when_required`를
    # 넣어봤으나 **증상이 그대로**라 원인은 미규명이다.
    # 🔴 배선을 남겨두면 WAL이 PVC에 계속 쌓이므로(5Gi가 찬다) 참조를 뺀 상태로 둔다.
    # 선언 파일(k8s/catalog-pg-backup.yaml)과 설치 경로는 유지 — 원인 규명 후 아래를 되살린다.
    #
    # plugins:
    #     - name: barman-cloud.cloudnative-pg.io
    #       isWALArchiver: true
    #       parameters:
    #           barmanObjectName: catalog-pg-backup
    postgresql:
        parameters:
            # 카탈로그는 테이블 메타만 담아 데이터가 작다 → 상한(768Mi)에 맞춰 보수적으로 잡는다.
            # 접속자: Dagster(pyiceberg)·Spark·Flink·dbt(docs/resource-sizing.md §Postgres).
            shared_buffers: 128MB
            max_connections: "100"
    storage:
        size: 5Gi
        # kind 기본 SC(rancher.io/local-path). 🔴 `ALLOWVOLUMEEXPANSION=false`라 **사후 확장이 안 된다**
        # (2026-08-19 실측) → 처음에 넉넉히 잡는다. 늘리려면 클러스터 재생성이다.
        storageClass: standard
    # §2 requests/limits 필수. 수치 근거는 docs/resource-sizing.md §B.
    resources:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {cpu: 500m, memory: 768Mi}
