# SeaweedFS (S3 호환 오브젝트 스토어) — PoC 최소 구성(all-in-one: master+volume+filer+s3)
# S3 크리덴셜(s3.json)은 Secret(lakehouse-creds)에서 마운트 — 하드코딩 금지
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: seaweedfs
    namespace: default
spec:
    serviceName: seaweedfs
    replicas: 1
    selector:
        matchLabels:
            app: seaweedfs
    template:
        metadata:
            labels:
                app: seaweedfs
        spec:
            containers:
                - name: seaweedfs
                  image: chrislusf/seaweedfs:3.80
                  args:
                      - server
                      - -dir=/data
                      - -s3
                      - -s3.config=/etc/seaweedfs/s3.json
                      - -master.volumeSizeLimitMB=1024
                      # 🔴 10 → 30. SeaweedFS는 **버킷(collection)마다 별도 볼륨**을 잡는데
                      #   슬롯이 차면 새 collection 쓰기가 `InternalError`로 죽는다.
                      #   2026-08-27 실측: `volume:10/10 active:10 free:0`이고 그중 warehouse는 3개,
                      #   나머지 7개는 collection 없는 기본 볼륨(합계 ~470KB)이 슬롯만 점유하고 있었다.
                      #   증상: PutObject → `No writable volumes and no free volumes left`.
                      #   ⚠️ 이것이 `pg-backup`(Barman WAL) 실패의 원인이기도 하다 —
                      #   구 주석의 aws-chunked 체크섬 가설은 **잘못된 갈래**였다
                      #   (체크섬 env가 켜진 상태에서 재현됐고, 같은 클라이언트로 warehouse는 성공했다).
                      #   디스크가 아니라 **슬롯 상한**이 급소다(실측 시점 디스크 49GB 여유).
                      - -volume.max=30
                      # preallocate를 끈다 — 켜져 있으면 볼륨당 1GiB를 미리 잡아
                      #   30 슬롯이 30GiB 예약이 된다. 로컬 PoC에는 온디맨드 증가가 맞다.
                      - -master.volumePreallocate=false
                  ports:
                      - {containerPort: 8333, name: s3}
                      - {containerPort: 8888, name: filer}
                      - {containerPort: 9333, name: master}
                  volumeMounts:
                      - {name: data, mountPath: /data}
                      - {name: s3config, mountPath: /etc/seaweedfs, readOnly: true}
                  resources:
                      requests: {cpu: 300m, memory: 768Mi}
                      limits: {cpu: "1", memory: 1536Mi}
            volumes:
                - name: s3config
                  secret:
                      secretName: lakehouse-creds
                      items:
                          - {key: s3.json, path: s3.json}
    volumeClaimTemplates:
        - metadata:
              name: data
          spec:
              accessModes: [ReadWriteOnce]
              resources:
                  requests:
                      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
    name: seaweedfs
    namespace: default
spec:
    selector:
        app: seaweedfs
    ports:
        - {name: s3, port: 8333, targetPort: 8333}
        - {name: filer, port: 8888, targetPort: 8888}
        - {name: master, port: 9333, targetPort: 9333}
