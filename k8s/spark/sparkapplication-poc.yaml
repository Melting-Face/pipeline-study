# SparkApplication(Apache Spark K8s Operator) — PoC 인제스트 잡
# Kubeflow(sparkoperator.k8s.io/v1beta2)에서 Apache 공식 오퍼레이터로 이전 완료.
# Apache 오퍼레이터는 spark-submit 설정 기반이라 대부분을 sparkConf로 표현한다(구조적 driver/executor 블록 대신).
# 크리덴셜은 Secret(lakehouse-creds)에서 env로 주입(CRD 평문 노출 금지) — spark.kubernetes.*.secretKeyRef 사용.
#
# CRD·공식 예제 실측(chart 1.8.0 = appVersion 1.0.0 GA):
#   - 이 차트의 CRD는 **v1beta1(served) + v1(served·storage) 2버전**이다. storedVersions=["v1"]이고
#     제출된 오브젝트의 .apiVersion도 v1로 보이므로 **v1을 정본으로 쓴다**(2026-08-18 라이브 실측).
#   - PySpark 진입점은 spec 직속 **pyFiles**(type: string). `mainApplicationFile` 필드는 없다.
#     근거: examples/pi-python.yaml 이 pyFiles로 pi.py를 지정한다.
#   - driver SA는 차트 workloadResources.serviceAccount.name 기본값 **spark**(잡 네임스페이스에 생성).
#   - 진입점은 **driver CWD(/opt/spark/work-dir) 밖**에 둔다 — 같으면 복사 전 삭제 로직에 소스가 지워진다
#     (Dockerfile.spark-runner 주석 참고). 공식 예제도 /opt/spark/examples/... 를 쓴다.
apiVersion: spark.apache.org/v1
kind: SparkApplication
metadata:
    name: poc-ingest
    namespace: default
spec:
    runtimeVersions:
        sparkVersion: "4.1.3"
    # 파이썬 메인 파일 (spec 직속 pyFiles — CRD·공식 예제로 확정)
    pyFiles: "local:///opt/spark/app/poc_ingest.py"
    applicationTolerations:
        # 호스트 Dagster가 종료 후 driver 로그를 회수해야 하므로 성공 시에도 리소스를 남긴다.
        # OnFailure면 성공 즉시 driver 파드가 지워져 로그·행 수 메타를 못 남긴다(2026-08-17 실측).
        # 무기한 보존(-1 기본값)은 피하고 10분 뒤 오퍼레이터가 정리하게 한다. v1 전용 필드다.
        resourceRetainPolicy: Always
        resourceRetainDurationMillis: 600000
    sparkConf:
        # 러너 이미지(로컬 레지스트리, 호스트·클러스터 공통 이름)
        spark.kubernetes.container.image: "localhost:5001/spark-runner:0.6.0"
        spark.kubernetes.container.image.pullPolicy: "Always"
        spark.kubernetes.authenticate.driver.serviceAccountName: "spark"
        # driver/executor 자원 (수치 근거: docs/resource-sizing.md)
        spark.driver.cores: "1"
        spark.driver.memory: "1024m"
        spark.executor.instances: "1"
        spark.executor.cores: "1"
        spark.executor.memory: "1024m"
        # 평문 env (driver: spark.kubernetes.driverEnv.* / executor: spark.executorEnv.*)
        # 카탈로그 이름은 전 엔진 공통(Dagster·Trino와 동일). 다르면 레지스트리가 분리된다.
        spark.kubernetes.driverEnv.ICEBERG_CATALOG_NAME: "iceberg"
        # 쓰기 대상 네임스페이스(필수 — poc_ingest.py는 기본값 없이 KeyError로 멈춘다)
        spark.kubernetes.driverEnv.POC_NAMESPACE: "poc"
        spark.executorEnv.ICEBERG_CATALOG_NAME: "iceberg"
        spark.kubernetes.driverEnv.ICEBERG_JDBC_URI: "jdbc:postgresql://catalog-postgres-rw:5432/iceberg"
        spark.kubernetes.driverEnv.ICEBERG_WAREHOUSE: "s3://warehouse"
        spark.kubernetes.driverEnv.S3_ENDPOINT: "http://seaweedfs:8333"
        # AWS SDK v2(S3FileIO)는 region 필수 — SeaweedFS는 무시하나 값이 있어야 client가 뜬다
        spark.kubernetes.driverEnv.AWS_REGION: "us-east-1"
        spark.kubernetes.driverEnv.AWS_DEFAULT_REGION: "us-east-1"
        spark.executorEnv.ICEBERG_JDBC_URI: "jdbc:postgresql://catalog-postgres-rw:5432/iceberg"
        spark.executorEnv.ICEBERG_WAREHOUSE: "s3://warehouse"
        spark.executorEnv.S3_ENDPOINT: "http://seaweedfs:8333"
        spark.executorEnv.AWS_REGION: "us-east-1"
        spark.executorEnv.AWS_DEFAULT_REGION: "us-east-1"
        # 🔴 이 잡의 S3 접근 경로는 **둘**이고, 0.6.0(Spark 4.1 · Hadoop 3.4.2)부터 **둘 다 SDK v2**다.
        #   ① S3A(`fs.s3a.*`, hadoop-aws 3.4.2) ② S3FileIO(Iceberg `io-impl`)
        #   두 경로는 러너의 SDK v2 `bundle` **한 벌**(2.29.52)을 공유한다 — 경계 2.30.0 **이전**이라
        #   기본값이 이미 WHEN_REQUIRED다. iceberg-aws-bundle(SDK 2.44.4)을 함께 실으면 S3A까지
        #   경계를 넘은 판본으로 돈다(docs/conventions/k8s/checksum.md §2-1).
        #   SeaweedFS가 SDK v2의 aws-chunked 프레이밍을 풀지 못해 객체가 조용히 손상된다
        #   (CLAUDE.md 운영 §K8s). 2026-08-21 실측 — aws-bundle 1.6.1(SDK v2 2.26.20)에서는
        #   문제없었으나 러너 0.5.0의 1.11.0(SDK v2 2.44.4)에서 재현됐다.
        #   아래 env 2종은 판본을 올리는 변경이 방어선까지 지우지 않게 하는 이중 방어로 **유지**한다.
        #   driver·executor 어느 쪽이 metadata를 쓰는지 단정할 수 없어 **양쪽 모두** 주입한다.
        #   ⚠️ Iceberg `s3.checksum-enabled`와 혼동하지 말 것 — 이름만 비슷하고 방향이 반대다
        #   (S3FileIO가 체크섬을 **더 붙이는** 옵션이며 기본 false, 여기서 건드리지 않는다).
        spark.kubernetes.driverEnv.AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
        spark.kubernetes.driverEnv.AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
        spark.executorEnv.AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
        spark.executorEnv.AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
        # Secret → env : spark.kubernetes.{driver,executor}.secretKeyRef.<ENV> = <secret>:<key>
        # PG 크리덴셜은 CNPG bootstrap 시크릿(catalog-pg-app, basic-auth 고정 키)에서 온다
        spark.kubernetes.driver.secretKeyRef.PG_USER: "catalog-pg-app:username"
        spark.kubernetes.driver.secretKeyRef.PG_PASSWORD: "catalog-pg-app:password"
        spark.kubernetes.driver.secretKeyRef.S3_ACCESS_KEY: "lakehouse-creds:s3-access-key"
        spark.kubernetes.driver.secretKeyRef.S3_SECRET_KEY: "lakehouse-creds:s3-secret-key"
        spark.kubernetes.executor.secretKeyRef.PG_USER: "catalog-pg-app:username"
        spark.kubernetes.executor.secretKeyRef.PG_PASSWORD: "catalog-pg-app:password"
        spark.kubernetes.executor.secretKeyRef.S3_ACCESS_KEY: "lakehouse-creds:s3-access-key"
        spark.kubernetes.executor.secretKeyRef.S3_SECRET_KEY: "lakehouse-creds:s3-secret-key"
