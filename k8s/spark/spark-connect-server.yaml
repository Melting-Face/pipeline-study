# Spark Connect 서버 — dbt-spark가 붙는 **상시 SQL 엔드포인트**(Phase 1)
#
# 왜 이게 필요한가: 기존 컴퓨트는 `SparkApplication`(job-per-application)이라 잡이 끝나면 사라진다.
#   dbt는 세션에 계속 붙어 SQL을 날려야 하므로 붙을 대상이 없다. Thrift(HiveServer2) 대신
#   **Spark Connect**를 쓴다 — gRPC 기반이라 클라이언트가 가볍고(pyspark[connect]),
#   dbt-spark의 `method: session`에 `spark.remote`만 주면 그대로 원격이 된다(어댑터 변경 불필요).
#
# ⚠️ 자원 규칙과의 관계: 이 서버는 **상주**하고, `--master k8s://` 이후에는 **executor 파드 1개도
#   함께 상주**한다 — `spark.executor.instances`는 정적 할당이라 세션이 살아 있는 내내 산다.
#   쓰지 않을 때는 `kubectl scale deploy/spark-connect --replicas=0`.
#   🔴 그때 **executor가 함께 사라지는지 반드시 확인**한다. 아래 `spark.kubernetes.driver.pod.name`이
#   빠지면 driver만 내려가고 executor가 남아 **아무 신호 없이 1 CPU를 계속 점유**한다.
#   경계·배분은 conventions/k8s.md §9-3 · resource-sizing.md.
#
# 크리덴셜은 Secret→env로 주입하고 셸에서 확장한다(매니페스트 평문 금지, §4).
apiVersion: apps/v1
kind: Deployment
metadata:
    name: spark-connect
    namespace: default
spec:
    replicas: 1
    # 🔴 RollingUpdate(기본)를 쓰지 않는 이유: 롤아웃 중 driver 파드가 잠깐 **2개**가 되고,
    #   두 driver가 각자 executor를 요청해 그 순간 `spark.executor.instances ≤ 1`(§9-3 경계 ②)이
    #   **2로 깨진다**. 예산 초과는 에러가 아니라 `Pending`으로 조용히 나타난다.
    #   local 모드에서는 executor가 없어 무해했으므로 이것은 **k8s:// 전환이 만든 새 요구**다.
    strategy: {type: Recreate}
    selector:
        matchLabels: {app: spark-connect}
    template:
        metadata:
            labels: {app: spark-connect}
        spec:
            serviceAccountName: spark
            containers:
                - name: spark-connect
                  # 🔴 앵커를 쓰는 이유: executor 이미지(`spark.kubernetes.container.image`)는 driver와
                  #   **같은 것**이어야 하는데, 값을 두 번 적으면 한쪽만 올리는 드리프트가 생긴다.
                  #   앵커로 묶어 **단일 출처**로 둔다(아래 env `SPARK_K8S_IMAGE`가 이 값을 받는다).
                  image: &spark_image localhost:5001/spark-runner:0.5.0
                  imagePullPolicy: Always
                  # `spark.hadoop.fs.*` 가 따로 필요한 이유:
                  #   Iceberg의 S3FileIO(`io-impl`)는 **카탈로그가 아는 파일**만 읽고 쓴다.
                  #   반면 `remove_orphan_files`는 warehouse 디렉터리를 **Hadoop FileSystem으로 나열**해
                  #   카탈로그가 모르는 파일을 찾아낸다 → S3FileIO로는 대체가 안 된다.
                  #   설정이 없으면 `UnsupportedFileSystemException: No FileSystem for scheme "s3"`로 죽는다
                  #   (2026-08-19 실측). warehouse가 `s3://`라 `fs.s3.impl`도 S3A로 매핑해야 한다.
                  #   jar(hadoop-aws·aws-java-sdk-bundle)는 러너 이미지에 이미 구워져 있다.
                  #
                  # 🔴 이 파드에는 S3 접근 경로가 **둘**이고, aws-chunked 체크섬 영향이 서로 다르다.
                  #   ① S3A(`spark.hadoop.fs.s3*`) → aws-java-sdk-bundle = AWS SDK **v1**(1.12.262)
                  #      → flexible checksum이 없어 SeaweedFS의 aws-chunked 문제와 **무관**하다.
                  #   ② S3FileIO(Iceberg `io-impl`, iceberg-aws-bundle) → AWS SDK **v2**
                  #      → **영향받는다.** 아래 env 2종이 없으면 PUT 객체가 손상된 채 저장된다.
                  #   이전 주석은 ①만 보고 "무관"으로 닫아 ②의 설정 누락이 잠복했다.
                  #   2026-08-21 실측 — aws-bundle 1.6.1(SDK v2 2.26.20)에서는 문제없었으나
                  #   1.11.0(SDK v2 2.44.4)에서 PUT 객체가 aws-chunked 프레이밍인 채 저장됨.
                  # 🔴 실행 모드는 **client**다 — `--deploy-mode`를 주지 않는다.
                  #   `cluster`를 주면 spark-submit이 **별도 driver 파드**를 띄우고 이 파드는 즉시 종료해
                  #   Service가 gRPC 리스너 없는 대상을 가리킨다. 증상은 "접속 안 됨"이 아니라 **CrashLoop**다.
                  #   ⇒ driver = **이 Deployment 파드 그 자체**이고, driver 자원 다이얼은
                  #   `spark.driver.cores/memory`가 아니라 **아래 resources**다.
                  #
                  # ⓐ driver 도달 주소는 **Downward API POD_IP**를 쓴다(executor가 driver로 역접속한다).
                  #   architectures/spark.md는 처방을 "headless Service"로 적었으나 그쪽은
                  #   `publishNotReadyAddresses: false`가 기본이라 **readiness 통과 전에 A 레코드가 빈다**.
                  #   executor 요청은 gRPC 바인딩보다 **먼저** 일어나 초기 executor가 driver를 못 찾고,
                  #   증상이 에러가 아니라 **대기**다. POD_IP는 오브젝트를 안 늘리고 그 결합이 없다.
                  #
                  # ⓑ ❌ `spark.kubernetes.authenticate.driver.serviceAccountName`은 **넣지 않는다** —
                  #   그 키는 cluster mode에서 driver 파드 스펙을 만들 때 쓰인다. client mode의 인증 주체는
                  #   위 `serviceAccountName: spark`다. sparkapplication-poc.yaml에서 복붙하면
                  #   "설정했는데 안 먹는" 축이 하나 더 생긴다.
                  #
                  # ⓒ 🔴 `spark.kubernetes.driver.pod.name`이 **회수 다이얼의 전제**다. 없으면 executor에
                  #   ownerReference가 안 붙어 `--replicas=0`이 driver만 내리고 executor를 남긴다.
                  #   `deleteOnTermination`(기본 true)은 **정상 종료 경로만** 덮으므로 대체재가 아니다.
                  #
                  # ⓓ 🔴 체크섬 env 2종은 **executor에도** 간다. 지금까지는 driver=executor가 한 몸이라
                  #   driver env 하나로 덮였고 k8s:// 전환이 그 우연을 깬다 — 빠지면 SeaweedFS가
                  #   aws-chunked를 못 풀어 **PUT이 성공한 것처럼 보이면서 객체가 손상**된다(위 주석 ②).
                  #
                  # ⓔ PG 크리덴셜은 executor에 **넣지 않고 시작한다** — JdbcCatalog 해석·커밋은 driver에서
                  #   일어난다. 실패 서명은 executor 로그의 `org.postgresql` ·
                  #   `password authentication failed`이고, 뜨면 그때 secretKeyRef 2줄을 더한다.
                  #   넣고 시작하면 필요했는지 영원히 모른다(최소권한 §5 + 원칙 7).
                  #
                  # ⓕ ❌ `spark.sql.shuffle.partitions`는 **건드리지 않는다** — architectures/spark.md의
                  #   "발현하지 않은 성능 문제를 미리 고치지 않는다". 변인은 하나만 올린다.
                  command: ["/bin/bash", "-c"]
                  args:
                      - |
                        exec /opt/spark/bin/spark-submit \
                          --class org.apache.spark.sql.connect.service.SparkConnectServer \
                          --master "$SPARK_K8S_MASTER" \
                          --conf spark.connect.grpc.binding.port=15002 \
                          --conf spark.driver.host="$POD_IP" \
                          --conf spark.driver.bindAddress=0.0.0.0 \
                          --conf spark.driver.port=7078 \
                          --conf spark.blockManager.port=7079 \
                          --conf spark.kubernetes.driver.pod.name="$POD_NAME" \
                          --conf spark.kubernetes.namespace=default \
                          --conf spark.kubernetes.container.image="$SPARK_K8S_IMAGE" \
                          --conf spark.kubernetes.container.image.pullPolicy=Always \
                          --conf spark.executor.instances=1 \
                          --conf spark.executor.cores=1 \
                          --conf spark.executor.memory=1024m \
                          --conf spark.executor.memoryOverhead=384m \
                          --conf spark.kubernetes.executor.request.cores=1 \
                          --conf spark.kubernetes.executor.limit.cores=1 \
                          --conf spark.kubernetes.executor.deleteOnTermination=true \
                          --conf spark.kubernetes.executor.podNamePrefix=spark-connect \
                          --conf spark.kubernetes.executor.secretKeyRef.AWS_ACCESS_KEY_ID="$S3_KEY_REF" \
                          --conf spark.kubernetes.executor.secretKeyRef.AWS_SECRET_ACCESS_KEY="$S3_SEC_REF" \
                          --conf spark.executorEnv.AWS_REGION="$AWS_REGION" \
                          --conf spark.executorEnv.AWS_REQUEST_CHECKSUM_CALCULATION=when_required \
                          --conf spark.executorEnv.AWS_RESPONSE_CHECKSUM_VALIDATION=when_required \
                          --conf spark.sql.extensions="$ICEBERG_EXTENSIONS" \
                          --conf spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog \
                          --conf spark.sql.catalog.iceberg.catalog-impl=org.apache.iceberg.jdbc.JdbcCatalog \
                          --conf spark.sql.catalog.iceberg.uri="$ICEBERG_JDBC_URI" \
                          --conf spark.sql.catalog.iceberg.jdbc.user="$PG_USER" \
                          --conf spark.sql.catalog.iceberg.jdbc.password="$PG_PASSWORD" \
                          --conf spark.sql.catalog.iceberg.warehouse="$ICEBERG_WAREHOUSE" \
                          --conf spark.sql.catalog.iceberg.io-impl=org.apache.iceberg.aws.s3.S3FileIO \
                          --conf spark.sql.catalog.iceberg.s3.endpoint="$S3_ENDPOINT" \
                          --conf spark.sql.catalog.iceberg.s3.path-style-access=true \
                          --conf spark.sql.defaultCatalog=iceberg \
                          --conf spark.hadoop.fs.s3.impl=org.apache.hadoop.fs.s3a.S3AFileSystem \
                          --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem \
                          --conf spark.hadoop.fs.s3a.endpoint="$S3_ENDPOINT" \
                          --conf spark.hadoop.fs.s3a.path.style.access=true \
                          --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false \
                          spark-internal
                  # 🔴 `containerPort`는 트래픽을 여닫지 않는다 — 이것은 **기능이 아니라 문서**다.
                  #   driver-rpc·blockmanager는 **executor가 driver로 역접속**하는 포트이고,
                  #   위에서 `spark.driver.port`/`spark.blockManager.port`로 **고정**했기 때문에 적을 수 있다
                  #   (기본값은 임의 포트라 적을 수도, 정책을 걸 수도 없다).
                  ports:
                      - {name: grpc, containerPort: 15002}
                      - {name: ui, containerPort: 4040}
                      - {name: driver-rpc, containerPort: 7078}
                      - {name: blockmanager, containerPort: 7079}
                  env:
                      # CNPG가 만드는 쓰기 서비스(`-rw`). 읽기 전용은 `-ro`.
                      - {name: ICEBERG_JDBC_URI, value: "jdbc:postgresql://catalog-postgres-rw:5432/iceberg"}
                      - {name: ICEBERG_WAREHOUSE, value: "s3://warehouse"}
                      # 줄 길이 제한(yamllint 120) 회피 겸 재사용 — Iceberg SQL 확장 FQCN
                      - name: ICEBERG_EXTENSIONS
                        value: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
                      # k8s:// 전환 값 — 같은 이유로 env에 뽑는다.
                      # in-cluster API 주소는 고정이다(fabric8이 SA 토큰·CA를 자동으로 집는다).
                      - {name: SPARK_K8S_MASTER, value: "k8s://https://kubernetes.default.svc:443"}
                      - {name: SPARK_K8S_IMAGE, value: *spark_image}
                      # executor용 Secret 참조는 `<secret>:<key>` 형식이다(driver는 아래 valueFrom).
                      # ⚠️ 이름이지 값이 아니다 — 평문 금지 규약(§4)에 걸리지 않는다.
                      - {name: S3_KEY_REF, value: "lakehouse-creds:s3-access-key"}
                      - {name: S3_SEC_REF, value: "lakehouse-creds:s3-secret-key"}
                      # Downward API — ⓐ driver 광고 주소 · ⓒ executor ownerReference의 소유자
                      - name: POD_IP
                        valueFrom: {fieldRef: {fieldPath: status.podIP}}
                      - name: POD_NAME
                        valueFrom: {fieldRef: {fieldPath: metadata.name}}
                      - {name: S3_ENDPOINT, value: "http://seaweedfs:8333"}
                      - {name: AWS_REGION, value: "us-east-1"}
                      # SeaweedFS는 AWS SDK v2의 aws-chunked 프레이밍을 풀지 못해 객체가 조용히 손상된다.
                      # S3FileIO(위 주석 ②)가 SDK v2를 타므로 필수다(CLAUDE.md 운영 §K8s).
                      - {name: AWS_REQUEST_CHECKSUM_CALCULATION, value: "when_required"}
                      - {name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: "when_required"}
                      # PG 크리덴셜은 CNPG bootstrap 시크릿(basic-auth라 키 이름이 username/password 고정)
                      - name: PG_USER
                        valueFrom: {secretKeyRef: {name: catalog-pg-app, key: username}}
                      - name: PG_PASSWORD
                        valueFrom: {secretKeyRef: {name: catalog-pg-app, key: password}}
                      # S3 키는 AWS 표준 자격증명 체인으로 넘긴다(--conf에 안 적는다)
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom: {secretKeyRef: {name: lakehouse-creds, key: s3-access-key}}
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom: {secretKeyRef: {name: lakehouse-creds, key: s3-secret-key}}
                  readinessProbe:
                      tcpSocket: {port: 15002}
                      initialDelaySeconds: 20
                      periodSeconds: 10
                  resources:
                      requests: {cpu: "500m", memory: "1536Mi"}
                      limits: {cpu: "1", memory: "2Gi"}
---
apiVersion: v1
kind: Service
metadata:
    name: spark-connect
    namespace: default
spec:
    selector: {app: spark-connect}
    ports:
        - {name: grpc, port: 15002, targetPort: 15002}
        - {name: ui, port: 4040, targetPort: 4040}
---
# Spark Web UI 고정 URL — http://spark.localtest.me:8080 (kind extraPortMappings 8080→80)
# gRPC는 **호스트를 나눠** 아래 `spark-connect-grpc`로 낸다(UI는 평문 HTTP, gRPC는 TLS라
# 백엔드 프로토콜이 다르고, 그 설정은 Ingress 단위라 한 리소스에 섞을 수 없다).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: spark-connect-ui
    namespace: default
spec:
    ingressClassName: nginx
    rules:
        - host: spark.localtest.me
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: spark-connect
                            port:
                                number: 4040
---
# gRPC 엔드포인트용 리프 인증서 — 발급자는 k8s/local-ca.yaml의 로컬 CA.
# 호스트 클라이언트는 그 CA 하나만 신뢰하면 되므로, 이 리프가 갱신돼도 재배포가 필요 없다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: spark-grpc-tls
    namespace: default
spec:
    secretName: spark-grpc-tls
    duration: 8760h
    renewBefore: 720h
    dnsNames:
        - spark-grpc.localtest.me
    issuerRef:
        name: lakehouse-ca-issuer
        kind: Issuer
        group: cert-manager.io
---
# Spark Connect gRPC 고정 URL — sc://spark-grpc.localtest.me:8443 (kind extraPortMappings 8443→443)
#
# 🔴 **TLS는 선택이 아니라 전제다.** ingress-nginx의 gRPC 백엔드는 HTTP/2 위에서만 동작하는데
#   nginx는 HTTP/2를 **TLS 리스너에서만** 협상한다. 그래서 평문 gRPC 경로는 이 방식으로 못 만든다
#   (평문으로 내려면 새 호스트 포트가 필요한데 kind는 포트를 **클러스터 생성 시점에만** 정한다).
#
# 🔴 **UI와 호스트를 분리한 이유**: `backend-protocol`은 Ingress 단위 설정이라, 같은 호스트에
#   HTTP(UI 4040)와 GRPC(15002)를 함께 두면 한쪽이 반드시 깨진다.
#
# 클라이언트(2026-08-22 실측 — 이 경로로 pyspark 질의·카탈로그 조회 왕복 확인):
#   export SPARK_REMOTE="sc://spark-grpc.localtest.me:8443/;use_ssl=true"
#   export GRPC_DEFAULT_SSL_ROOTS_FILE_PATH=<CA 파일 경로>
# 🔴 `sc://` URL에는 **CA를 지정하는 옵션이 없다** — 신뢰 주입은 위 gRPC 코어 환경변수로만 된다.
#   CA 내보내기 명령과 배경은 docs/conventions/k8s.md §10.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: spark-connect-grpc
    namespace: default
    annotations:
        nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
spec:
    ingressClassName: nginx
    tls:
        - hosts:
              - spark-grpc.localtest.me
          secretName: spark-grpc-tls
    rules:
        - host: spark-grpc.localtest.me
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: spark-connect
                            port:
                                number: 15002
