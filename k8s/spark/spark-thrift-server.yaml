# Spark Thrift Server(HiveServer2) — dbt-spark가 붙는 **공식 지원** SQL 엔드포인트
#
# ⏸ **선언만 하고 배포하지 않는다**(2026-08-19). `trino`·`flink`와 같은 "중단과 삭제의 분리" —
#   정의는 남기고 상시 기동만 끊는다(자원 즉시 회수, 되살리는 비용 0).
#   되살리기: `kubectl apply -f k8s/spark/spark-thrift-server.yaml`
#
#   배포하지 않는 이유(둘 다 실측):
#     ① `spark_connect` 경로가 **실제로 동작한다** — 리모트 세션 생성 → `defaultCatalog=iceberg`
#        → `SHOW NAMESPACES IN iceberg`(poc 반환) → 질의 성공까지 확인했다.
#     ② 🔴 `method: thrift`의 클라이언트 의존성 `pyhive`·`thrift`·`thrift_sasl`이 **미설치**다.
#        `dbt/adapters/spark/connections.py:17-24`가 ImportError를 삼켜 `hive = None`으로 두므로,
#        서버만 띄우고 프로파일을 바꾸면 접속 시점에 `NoneType`으로 죽는다.
#        되살릴 때는 **`dbt-spark[PyHive]` 설치가 선행**돼야 한다.
#   상주 컴퓨트 +500m/1.5Gi를 무는 것은 위 둘이 해소된 뒤에 판단한다.
#
# 왜 Connect가 아니라 이것도 필요한가 (2026-08-19 어댑터 소스 실측):
#   dbt-spark 1.11.0이 지원하는 method는 `dbt/adapters/spark/connections.py:77-81` 기준
#   **thrift / http / odbc / session** 4개뿐이고 **Spark Connect는 없다**.
#   기존 `spark_connect` 프로파일은 어댑터 기능이 아니라 pyspark 내부 동작에 얹은 우회다:
#     ① `dbt/adapters/spark/session.py:116`이 classic 빌더로 `enableHiveSupport()` 호출
#     ② `server_side_parameters`의 `spark.remote`가 옵션 맵에 들어감
#     ③ `pyspark/sql/session.py:495-525`(4.1.3)가 `spark.remote` 존재를 보고 RemoteSparkSession으로 위임
#   🔴 이 경로에는 **조용한 실패**가 있다 — `pyspark/sql/connect/session.py:209-233`(4.1.3)의
#   `_apply_options`가 설정을 `_set_all(silent=True)`로 보내 실패를 삼킨다(3.5는 `warnings.warn()` 강등).
#   `enableHiveSupport()`가 무조건 넣는 `spark.sql.catalogImplementation=hive`는 static conf라
#   리모트에서 거부되지만 **경고로 삼켜져 죽지 않는다**. "도는 것"이 "지원되는 것"이 아니다
#   (docs/philosophy.md 원칙 7).
#   → 값의 정합이 중요한 경로(22모델 방언 검증·gold 산출)는 **thrift**를 정본으로 쓴다.
#
# ⚠️ 자원 규칙과의 관계: Spark Connect와 마찬가지로 **상주 컴퓨트**다.
#   쓰지 않을 때는 `kubectl scale deploy/spark-thrift --replicas=0`
#   (docs/resource-sizing.md (C) 운영 다이얼 0번).
#
# 이미지는 Connect와 **같은 러너**를 쓴다 — 0.6.0(Spark 4.1.3) 베이스에 `spark-hive-thriftserver_2.13-4.1.3.jar`·
# `hive-metastore-2.3.10.jar`·`derby-10.16.1.1.jar`가 이미 들어 있어 재빌드가 필요 없다(jars 목록 실측).
# 단 4.1 러너로 **기동해 본 적은 없다** — 되살릴 때 체크섬 env 2종과 함께 기동 검증부터 한다.
#
# 크리덴셜은 Secret→env로 주입하고 셸에서 확장한다(매니페스트 평문 금지, conventions/k8s.md §4).
apiVersion: apps/v1
kind: Deployment
metadata:
    name: spark-thrift
    namespace: default
spec:
    replicas: 1
    selector:
        matchLabels: {app: spark-thrift}
    template:
        metadata:
            labels: {app: spark-thrift}
        spec:
            serviceAccountName: spark
            containers:
                - name: spark-thrift
                  image: localhost:5001/spark-runner:0.6.0
                  imagePullPolicy: Always
                  # `spark.hadoop.fs.*`가 필요한 이유는 Connect 매니페스트와 동일 —
                  #   Iceberg S3FileIO는 카탈로그가 **아는** 파일만 다루므로 warehouse를 직접
                  #   나열하는 `remove_orphan_files`가 Hadoop FS를 타고 죽는다.
                  #
                  # 🔴 HiveThriftServer2는 기동 시 `SparkSQLEnv.init()`이 `enableHiveSupport()`를
                  #   강제하므로 **Hive 메타스토어가 반드시 생긴다**. 우리 테이블은 전부 Iceberg
                  #   JDBC 카탈로그에 있어 이 메타스토어는 껍데기지만, 기본값(파일 Derby)이면
                  #   컨테이너 CWD에 `metastore_db/`를 만들고 재기동마다 상태가 갈린다.
                  #   → **in-memory Derby**로 못 박아 디스크 상태를 아예 만들지 않는다.
                  command: ["/bin/bash", "-c"]
                  args:
                      - |
                        exec /opt/spark/bin/spark-submit \
                          --class org.apache.spark.sql.hive.thriftserver.HiveThriftServer2 \
                          --master "local[2]" \
                          --conf spark.hive.server2.thrift.port=10000 \
                          --conf spark.hive.server2.thrift.bind.host=0.0.0.0 \
                          --conf spark.hadoop.javax.jdo.option.ConnectionURL="jdbc:derby:memory:metastore_db;create=true" \
                          --conf spark.sql.warehouse.dir=/tmp/spark-warehouse \
                          --conf spark.sql.extensions="$ICEBERG_EXTENSIONS" \
                          --conf spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog \
                          --conf spark.sql.catalog.iceberg.catalog-impl=org.apache.iceberg.jdbc.JdbcCatalog \
                          --conf spark.sql.catalog.iceberg.uri="$ICEBERG_JDBC_URI" \
                          --conf spark.sql.catalog.iceberg.jdbc.user="$PG_USER" \
                          --conf spark.sql.catalog.iceberg.jdbc.password="$PG_PASSWORD" \
                          --conf spark.sql.catalog.iceberg.warehouse="$ICEBERG_WAREHOUSE" \
                          --conf spark.sql.catalog.iceberg.io-impl=org.apache.iceberg.aws.s3.S3FileIO \
                          --conf spark.sql.catalog.iceberg.s3.endpoint="$S3_ENDPOINT" \
                          --conf spark.sql.catalog.iceberg.s3.path-style-access=true \
                          --conf spark.sql.defaultCatalog=iceberg \
                          --conf spark.hadoop.fs.s3.impl=org.apache.hadoop.fs.s3a.S3AFileSystem \
                          --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem \
                          --conf spark.hadoop.fs.s3a.endpoint="$S3_ENDPOINT" \
                          --conf spark.hadoop.fs.s3a.path.style.access=true \
                          --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false \
                          spark-internal
                  ports:
                      - {name: jdbc, containerPort: 10000}
                      - {name: ui, containerPort: 4040}
                  env:
                      # CNPG가 만드는 쓰기 서비스(`-rw`). 읽기 전용은 `-ro`.
                      - {name: ICEBERG_JDBC_URI, value: "jdbc:postgresql://catalog-postgres-rw:5432/iceberg"}
                      - {name: ICEBERG_WAREHOUSE, value: "s3://warehouse"}
                      # 줄 길이 제한(yamllint 120) 회피 겸 재사용 — Iceberg SQL 확장 FQCN
                      - name: ICEBERG_EXTENSIONS
                        value: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
                      - {name: S3_ENDPOINT, value: "http://seaweedfs:8333"}
                      - {name: AWS_REGION, value: "us-east-1"}
                      # PG 크리덴셜은 CNPG bootstrap 시크릿(basic-auth라 키 이름이 username/password 고정)
                      - name: PG_USER
                        valueFrom: {secretKeyRef: {name: catalog-pg-app, key: username}}
                      - name: PG_PASSWORD
                        valueFrom: {secretKeyRef: {name: catalog-pg-app, key: password}}
                      # S3 키는 AWS 표준 자격증명 체인으로 넘긴다(--conf에 안 적는다)
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom: {secretKeyRef: {name: lakehouse-creds, key: s3-access-key}}
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom: {secretKeyRef: {name: lakehouse-creds, key: s3-secret-key}}
                  # 🔴 tcpSocket으로는 부족하다 — HiveServer2는 포트를 먼저 열고 세션 초기화를
                  #   마저 한다. Connect(15002)와 달리 JDBC 핸드셰이크가 실패하는 구간이 있어
                  #   포트 개방만 보면 "준비됨"이 거짓이 된다(원칙 7). beeline으로 실제 질의를 던진다.
                  readinessProbe:
                      exec:
                          command:
                              - /bin/bash
                              - -c
                              - >-
                                /opt/spark/bin/beeline -u 'jdbc:hive2://localhost:10000'
                                -e 'SELECT 1' --silent=true > /dev/null 2>&1
                      initialDelaySeconds: 45
                      periodSeconds: 15
                      timeoutSeconds: 20
                      failureThreshold: 6
                  resources:
                      requests: {cpu: "500m", memory: "1536Mi"}
                      limits: {cpu: "1", memory: "2Gi"}
---
apiVersion: v1
kind: Service
metadata:
    name: spark-thrift
    namespace: default
spec:
    selector: {app: spark-thrift}
    ports:
        - {name: jdbc, port: 10000, targetPort: 10000}
        - {name: ui, port: 4040, targetPort: 4040}
---
# Spark Web UI 고정 URL — http://spark-thrift.localtest.me:8080 (kind extraPortMappings 8080→80)
# JDBC(10000)는 Ingress로 내보내지 않는다 — nginx ingress는 HTTP(S)용이고 HiveServer2 binary
# 프로토콜은 TCP다. dbt는 port-forward나 in-cluster 주소로 붙으면 충분하다(YAGNI).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: spark-thrift-ui
    namespace: default
spec:
    ingressClassName: nginx
    rules:
        - host: spark-thrift.localtest.me
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: spark-thrift
                            port:
                                number: 4040
