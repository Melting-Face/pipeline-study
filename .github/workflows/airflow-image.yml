name: airflow-image

# main 머지 → (values 의 이미지 태그가 GHCR 에 없으면) DAG 검증 → Airflow 커스텀 이미지 빌드 → GHCR push.
#
# 🔴 버전의 단일 출처는 gitops/charts/airflow/values.yaml 의 `# bump-image-tag` 한 줄이다.
#    ArgoCD 는 그 태그를 당겨 가고, 이 워크플로는 같은 태그를 발행한다 — 둘이 갈릴 수 없다.
#    추출은 scripts/airflow-image-version.sh(마커 0·2개·형식 위반은 실패) — 테스트 scripts/tests/airflow-image-version.sh.
# 🔴 공개 발행의 사람 게이트는 **PR 머지**다(docs/risk.md §4). 태그 push 트리거를 걷어낸 이유:
#    수동 태그 단계가 버전 출처를 둘로 만들고(git 태그 ↔ values) 봇의 values bump 는 main 보호 규칙에 막힌다.
# 이미지 태그는 불변이다 — 이미 있으면 빌드하지 않고 성공으로 끝낸다(덮어쓰지 않는다).
# 롤백은 values 태그를 이전 값으로 되돌리는 PR 이다.
#
# 패키지명이 airflow-dags 가 아닌 이유: 같은 이름은 argocd-study 저장소가 이미 소유하고 있어
# 이 저장소의 GITHUB_TOKEN 에는 쓰기 권한이 없다.
#
# 권한: 기본 GITHUB_TOKEN 만 쓴다(PAT·저장소 Secret 추가 없음). 액션은 SHA 로 고정한다 —
# packages: write 를 쥔 워크플로라 태그 이동형 공급망 위험을 받지 않는다. 쓰기 권한은 publish 잡에만 준다.

on:
  push:
    branches: [main]
    paths:
      - 'images/airflow/**'
      - 'dagster/dockerfile.d/src/dbt_pipelines/**'
      - 'gitops/charts/airflow/values.yaml'
      - 'scripts/airflow-image-version.sh'
      - 'scripts/ghcr-tag-exists.sh'
      - '.github/workflows/airflow-image.yml'
  pull_request:
    paths:
      - 'images/airflow/**'
      - 'dagster/dockerfile.d/src/dbt_pipelines/**'
      - 'gitops/charts/airflow/values.yaml'
      - 'scripts/airflow-image-version.sh'
      - 'scripts/ghcr-tag-exists.sh'
      - '.github/workflows/airflow-image.yml'

# 같은 ref 의 실행을 직렬화한다(진행 중인 실행은 취소하지 않는다 — 발행 도중 취소를 피한다).
concurrency:
  group: image-airflow-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GHCR_REPO: melting-face/pipeline-study-airflow
  IMAGE: ghcr.io/melting-face/pipeline-study-airflow
  VALUES: gitops/charts/airflow/values.yaml

jobs:
  # DagBag 파싱 — import 오류 0건·DAG id·태스크별 executor·의존 단언(#197). 발행 전 게이트이자 PR 검사다.
  test:
    name: DAG import 테스트
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 버전 추출 테스트
        run: bash scripts/tests/airflow-image-version.sh

      - name: DAG import 테스트 (docker)
        env:
          CONTAINER_CLI: docker
        run: bash images/airflow/tests/dag-import.test.sh

  # PR 에서만 — 이미지 내용이 바뀌었으면 values 태그도 올라가야 하고, 그 태그는 아직 발행 전이어야 한다.
  # 그렇지 않으면 머지 뒤 publish 가 「이미 있음」으로 건너뛰어 바뀐 DAG 가 영영 발행되지 않는다(조용한 실패).
  version-check:
    name: 이미지 태그 bump 검사
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: base 대비 태그·이미지 변경 판정
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_REF}"
          head_ver="$(bash scripts/airflow-image-version.sh "${VALUES}")"
          git show "origin/${BASE_REF}:${VALUES}" > /tmp/base-values.yaml
          base_ver="$(bash scripts/airflow-image-version.sh /tmp/base-values.yaml)"
          echo "base=${base_ver} head=${head_ver}"
          # 이미지 내용 = 빌드 컨텍스트에서 tests/ 를 뺀 것 + 추가 컨텍스트 dbt(dbt 프로젝트, COPY --from=dbt).
          # 🔴 dbt 를 빼면 모델만 바뀐 PR 이 bump 없이 통과하고 publish 가 「변경 없음」으로 건너뛴다.
          # tests/ 만 바뀐 PR 에 bump 를 요구하면 같은 내용이 새 태그로 중복 발행된다.
          if git diff --quiet "origin/${BASE_REF}...HEAD" -- images/airflow ':(exclude)images/airflow/tests' dagster/dockerfile.d/src/dbt_pipelines; then
              # 내용이 그대로면 태그만 바꾸는 PR(롤백·재지정)이다 — 이미 있는 태그를 가리켜도 정당하다
              echo "이미지 내용(images/airflow, tests 제외) 변경 없음 — bump 요구하지 않는다"
              exit 0
          fi
          if [ "${head_ver}" = "${base_ver}" ]; then
              echo "::error::이미지 내용이 바뀌었는데 ${VALUES} 의 태그(${head_ver})가 그대로다 — 올린다"
              exit 1
          fi
          # 내용이 바뀐 새 태그는 아직 발행 전이어야 한다(불변). 판정 불가(rc 2)는 실패로 끝낸다.
          rc=0
          bash scripts/ghcr-tag-exists.sh "${GHCR_REPO}" "${head_ver}" || rc=$?
          if [ "${rc}" -eq 0 ]; then
              echo "::error::${IMAGE}:${head_ver} 가 이미 있다 — 태그는 불변이다, 다음 버전으로 올린다"
              exit 1
          elif [ "${rc}" -ne 1 ]; then
              echo "::error::${IMAGE}:${head_ver} 존재를 판정하지 못했다"
              exit 1
          fi

  publish:
    name: GHCR 발행
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # push 직전 커밋(event.before)과의 내용 비교에 필요하다
          persist-credentials: false # packages:write 토큰을 .git/config 에 남기지 않는다

      # 🔴 명령 치환을 echo 인자 안에 두지 않는다 — 추출이 실패해도 echo 가 rc 0 을 내 빈 버전으로 진행한다
      - name: 버전 추출
        id: version
        run: |
          v="$(bash scripts/airflow-image-version.sh "${VALUES}")"
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: GHCR 로그인
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 판정 표 — 태그가 없으면 빌드, 있으면 건너뛴다. 단 이번 push 가 이미지 내용을 바꿨는데 태그가 이미
      # 있으면 **실패**한다: 건너뛰면 바뀐 DAG 가 영영 발행되지 않는데 run 은 초록이 된다(조용한 실패 —
      # PR 검사를 무시한 머지, 같은 태그로 bump 한 PR 두 개의 순차 머지가 이 경로다).
      # 존재 판정 불가(rc 2)도 실패다 — 「없음」으로 읽으면 불변 태그를 덮어쓴다.
      - name: 발행 여부 판정
        id: exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          rc=0
          bash scripts/ghcr-tag-exists.sh "${GHCR_REPO}" "${VERSION}" || rc=$?
          if [ "${rc}" -eq 1 ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
          elif [ "${rc}" -ne 0 ]; then
              echo "::error::${IMAGE}:${VERSION} 존재를 판정하지 못했다"
              exit 1
          fi
          # 태그가 이미 있다 — 이번 push 의 이미지 내용 변경 여부로 skip/실패를 가른다
          if [[ "${BEFORE}" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              echo "::warning::직전 커밋(${BEFORE})을 비교할 수 없다 — ${VERSION} 이미 있어 건너뛴다"
          elif ! git diff --quiet "${BEFORE}" "${GITHUB_SHA}" -- images/airflow ':(exclude)images/airflow/tests' dagster/dockerfile.d/src/dbt_pipelines; then
              echo "::error::이미지 내용이 바뀌었는데 ${IMAGE}:${VERSION} 가 이미 있다 — values 태그를 올리는 PR 이 필요하다"
              exit 1
          else
              echo "${IMAGE}:${VERSION} 이미 발행됨, 이미지 내용 변경 없음 — 건너뛴다"
          fi
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: 이미지 빌드·push
        if: steps.exists.outputs.skip == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/airflow
          # dbt 프로젝트는 컨텍스트 밖이라 이름 붙은 추가 컨텍스트로 넘긴다(Dockerfile 의 COPY --from=dbt,
          # 로컬 테스트 images/airflow/tests/dag-import.test.sh 의 --build-context 와 같은 이름)
          build-contexts: |
            dbt=dagster/dockerfile.d/src/dbt_pipelines
          platforms: linux/arm64
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          push: true
