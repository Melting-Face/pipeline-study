name: ci

# 서버측 품질 게이트 (2026-08-23 신설).
#
# 왜 필요한가: 이전까지 모든 게이트가 **로컬 pre-commit 전용**이었다 — 훅 19개·가드 스크립트
# 6종·permissions 124규칙이 전부 개발자 머신에만 살아서 `git commit --no-verify` 한 번이나
# `pre-commit install`을 안 한 클론이면 **전부 우회**됐다(.pre-commit-config.yaml §한계 자백).
# 로컬 훅은 "실수 방지"이고 이 워크플로가 "봉쇄"다.
#
# 설계 원칙:
#   1. 🔴 **인프라에 붙는 명령은 넣지 않는다.** 게이트가 클러스터 가용성에 묶이면 커밋이 막힌다 —
#      이 저장소는 sqlfluff `templater = "dbt"`가 Spark Connect에 접속하는 바람에 22개 모델이
#      오래 무검사로 남은 전례가 있다(pyproject.toml §templater). 여기 있는 스텝은 전부
#      **파일만 읽는다**. `dbt build`·`terraform plan`·spark_connect_smoke는 수동 관문으로 남긴다.
#   2. 🔴 **크리덴셜은 명백히 가짜만 쓴다**(`ci-dummy`). 정의 로드는 문자열만 읽고 접속하지
#      않으므로 진짜 값이 필요 없다. secrets를 넣는 순간 원칙 1이 깨진다.
#   3. **규칙의 단일 출처는 저장소 설정 파일**이다(pyproject.toml·.gitlint·.pre-commit-config.yaml).
#      이 워크플로는 '무엇을 언제 실행할지'만 정하고 규칙을 재선언하지 않는다.
#   4. **외부 도구는 액션이 아니라 러너에 직접 깐다**(hadolint·terraform). GitHub Actions의
#      JavaScript 액션은 러너 Node 런타임에 묶여 **deprecation 사이클마다 워크플로가 흔들린다**
#      (`hashicorp/setup-terraform@v3`의 Node 20 경고가 그 사례였다). `run:` 스텝은 그 축에서
#      벗어나고, 대가는 설치 절차를 우리가 지는 것뿐이다.
#
# 로컬 사전 검증(2026-08-23, HEAD a7cdf59): pre-commit 18훅 통과 / mypy 23파일 0오류(스텁 포함) /
# dbt parse env 0개로 통과 / dg check defs 통과 / gitlint 위반 1건 실발동(CT1).
# 🔴 **ubuntu-latest에서의 재현은 첫 PR이 검증한다** — 로컬 통과를 CI 통과로 읽지 않는다.

on:
  pull_request:
  push:
    branches: [main]

# 같은 ref에 새 푸시가 오면 진행 중인 검사를 취소한다(러너 낭비 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# terraform 버전의 **단일 출처**. 두 잡(`lint`·`terraform`)이 같은 바이너리를 요구하는데,
# 숫자를 각 잡에 박으면 한쪽만 올렸을 때 **버전이 조용히 갈린다**.
# 🔴 hadolint와 달리 **저장소 안에서 뽑아올 곳이 없다** — `.pre-commit-config.yaml`의
#    `rev: v1.109.0`은 *pre-commit-terraform*의 버전이지 terraform의 버전이 아니고,
#    `terraform/*/versions.tf`의 `required_version`은 `>= 1.5.0` **하한**이라 특정 값이 아니다.
#    그래서 여기가 출처가 된다("hadolint처럼 rev에서 뽑는다"가 성립하지 않는 자리다).
env:
  TERRAFORM_VERSION: "1.15.8"

jobs:
  lint:
    name: 린트·포맷·시크릿 (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # src 프로젝트 requires-python = ">=3.10,<3.15", 로컬 venv와 일치

      # hadolint 훅(id: hadolint)은 `language: system`이라 **로컬 바이너리**를 부른다.
      # 업스트림 `hadolint-docker`는 docker CLI를 요구하는데 개발 머신이 podman이라 이 훅을 쓴다.
      # 🔴 버전은 .pre-commit-config.yaml의 `rev`에서 뽑는다 — 여기 숫자를 박으면 두 곳이 갈린다.
      - name: hadolint 설치 (rev와 동일 버전)
        run: |
          ver=$(grep -A1 'hadolint/hadolint' .pre-commit-config.yaml | grep 'rev:' | awk '{print $2}')
          echo "hadolint ${ver} 설치"
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${ver}/hadolint-Linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint
          hadolint --version

      # 🔴 `terraform_fmt` 훅은 **terraform 바이너리를 부른다.** 없으면
      #    `Neither Terraform nor OpenTofu binary could be found` 로 훅이 실패한다
      #    (2026-08-28 실측 — 로컬은 terraform 이 깔려 있어 통과했고 CI 에서만 터졌다).
      #    hadolint 와 같은 처리다: 훅이 `language: system` 계열이면 러너에도 도구를 깐다.
      # ⚠️ 이 게이트는 **개발 머신에도 terraform 이 있어야** 돈다. 없는 사람에게는
      #    커밋이 막히므로 docs/setup.md §0 사전 요구 도구에 넣어야 한다(아직 미반영).
      #
      # 액션(`hashicorp/setup-terraform`)을 쓰지 않는 이유는 머리 주석 원칙 4를 본다.
      # ⚠️ **`terraform_wrapper: false` 가 사라진 것은 설정을 빠뜨린 게 아니다** — 그 옵션은
      #    액션이 씌우는 stdout 래퍼를 끄는 용도이고, 직접 설치에는 래퍼 자체가 없다.
      # ⚠️ hadolint 스텝보다 **검증이 한 단계 강하다**(체크섬 대조). 강도를 맞추려고 뺀 것이
      #    아니라 HashiCorp 가 `SHA256SUMS` 를 제공해서 쓴다 — hadolint 는 단일 바이너리라
      #    같은 수단이 없다. 두 스텝이 다른 이유를 적어두지 않으면 다음 사람이 누락으로 읽는다.
      - name: terraform 설치 (env TERRAFORM_VERSION 과 동일 버전)
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLO "${base}/${zip}"
          curl -fsSLO "${base}/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          grep " ${zip}$" "terraform_${TERRAFORM_VERSION}_SHA256SUMS" | sha256sum -c -
          # 마지막 인자로 **뽑을 파일을 지정**한다 — zip 에는 `LICENSE.txt` 도 들어 있어
          # 생략하면 그것까지 /usr/local/bin 에 풀린다(실측 — CI 로그에 inflating 이 찍혔다).
          sudo unzip -o -d /usr/local/bin "${zip}" terraform
          terraform version

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: python -m pip install --upgrade pre-commit

      # 🔴 repo 루트에서 실행한다 — sqlfluff `library_path`(sqlfluff_libs)가 CWD 기준이다.
      # --show-diff-on-failure: 수정형 훅(ruff-format·sqlfluff-fix 등)이 무엇을 바꾸려 했는지 보여준다.
      - run: pre-commit run --all-files --show-diff-on-failure

  commit-msg:
    name: 커밋 메시지 (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 커밋 범위 비교에 전체 이력이 필요하다

      - uses: astral-sh/setup-uv@v10.0.1

      # gitlint는 commit-msg 스테이지 훅이라 `pre-commit run --all-files`가 **건너뛴다**.
      # 규칙 정본은 루트 .gitlint(contrib-title-conventional-commits).
      # 🔴 실행 파일은 `gitlint-core`가 제공한다 — `uvx gitlint`는 실행 파일을 못 찾는다.
      - name: PR 커밋 전수 검사
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          uvx --from gitlint-core gitlint --commits "origin/${{ github.base_ref }}..HEAD"

  terraform:
    name: Terraform 검증 (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `lint` 잡과 **같은 스텝**이다(근거는 그쪽 주석). 사용처가 2회라 composite action 으로
      # 뽑지 않는다 — 재사용 추출은 **3회부터**다(CLAUDE.md 코딩 철학 5). 버전이 갈리지 않는
      # 것은 추출이 아니라 워크플로 레벨 `env` 가 보증한다.
      - name: terraform 설치 (env TERRAFORM_VERSION 과 동일 버전)
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLO "${base}/${zip}"
          curl -fsSLO "${base}/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          grep " ${zip}$" "terraform_${TERRAFORM_VERSION}_SHA256SUMS" | sha256sum -c -
          # 마지막 인자로 **뽑을 파일을 지정**한다 — zip 에는 `LICENSE.txt` 도 들어 있어
          # 생략하면 그것까지 /usr/local/bin 에 풀린다(실측 — CI 로그에 inflating 이 찍혔다).
          sudo unzip -o -d /usr/local/bin "${zip}" terraform
          terraform version

      # 🔴 `validate`가 pre-commit이 아니라 여기 있는 이유:
      #    `validate`는 `init`이 선행돼야 하는데 `.terraform/providers`는 gitignore라
      #    저장소에 없다. 훅에서 `init`을 돌리면 **커밋이 레지스트리 가용성에 묶인다** —
      #    `sqlfluff`의 `templater = "dbt"`에서 이미 겪은 함정이다(conventions/dbt.md).
      #    CI는 어차피 네트워크를 쓰므로 여기가 맞는 자리다.
      # `-backend=false`: state 백엔드 접속 없이 프로바이더만 받는다(자격증명 불필요).
      # 스택이 늘면 이 루프가 자동으로 집는다 — 목록을 두 곳에 두지 않는다.
      - name: 스택별 init + validate
        run: |
          set -euo pipefail
          found=0
          for dir in terraform/*/; do
            [ -f "${dir}versions.tf" ] || continue
            found=$((found + 1))
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false -no-color
            terraform -chdir="${dir}" validate -no-color
            echo "::endgroup::"
          done
          # 🔴 0건을 통과로 읽지 않는다 — 디렉터리 구조가 바뀌면 이 잡이 조용히 무의미해진다.
          if [ "${found}" -eq 0 ]; then
            echo "terraform/ 아래에서 versions.tf 를 가진 스택을 찾지 못했다" >&2
            exit 1
          fi
          echo "검증한 스택: ${found}개"

  defs:
    name: 타입·정의 로드 (mypy · dg check defs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # 🔴 `--frozen`을 쓰지 않는다 — 이 저장소는 **uv.lock을 커밋하지 않는다**(의도적 결정,
      #    docs/conventions/git.md §5: 이미지 빌드가 `pip install -e`를 써서 락이 재현성에
      #    기여하지 않고 >500KB라 제외). 초안은 `--frozen`을 걸고 "락 드리프트 게이트를
      #    겸한다"고 적었으나 **틀린 전제였다** — CI 첫 실행이 `Unable to find lockfile`로
      #    잡아냈다(로컬은 디스크에 락이 있어 끝까지 안 드러난다).
      # ⚠️ 대가: 매 실행이 새로 해석하므로 **상류 릴리스가 PR과 무관하게 빨간불을 낼 수 있다.**
      #    이 저장소는 dagster 계열 `==` 고정 + dbt-spark/pyspark 상한으로 드리프트를 좁혀두었고,
      #    비공식 Spark Connect 경로의 **업그레이드 회귀 감시**는 오히려 이쪽이 원하는 바다.
      - name: 의존성 설치
        working-directory: dagster/dockerfile.d/src
        run: uv sync --group dev

      # 🔴 repo 루트에서 실행한다 — [tool.mypy] 설정이 **루트** pyproject.toml에 있다
      #    (`disallow_untyped_defs = true`). src에서 돌리면 설정을 못 읽는다.
      # types-PyYAML은 `--with`로 붙인다 — .pre-commit-config.yaml §미포함이 적어둔
      # 수동 명령과 같은 형태이고, uv.lock을 건드리지 않는다.
      - name: mypy
        run: uv run --project dagster/dockerfile.d/src --with types-PyYAML mypy dagster/dockerfile.d/src/src

      # dg check defs는 manifest.json을 요구한다 — `prepare_if_dev()`는 비-dev에서 no-op이라
      # 여기서 미리 만들어야 한다(common/dbt.py §manifest가 명시).
      # dbt_packages/는 미커밋이라 deps 선행. 버전은 커밋된 package-lock.yml이 고정한다.
      # 🔴 parse는 접속하지 않는다 — 기본 타깃 spark_connect가 쓰는 SPARK_REMOTE에 기본값이 있고
      #    dbt는 선택된 타깃만 렌더한다(2026-08-23 실측: 환경변수 0개로 통과).
      - name: dbt deps + parse (manifest 생성)
        working-directory: dagster/dockerfile.d/src
        run: |
          uv run dbt deps --project-dir dbt_pipelines
          uv run dbt parse --project-dir dbt_pipelines --profiles-dir dbt_pipelines

      # 이 게이트가 잡는 것: **정의 로드를 실패시키는 변경**이다. 자산 키 중복으로 실측 확인했다
      # (프로브 → `DagsterInvalidDefinitionError: Duplicate asset key: AssetKey(['icustays'])`,
      #  실행 32621184901에서 이 스텝만 failure·mypy·dbt parse·lint·commit-msg는 통과).
      # 🔴 로컬 pre-commit은 이 축을 **전혀 보지 않는다** — 같은 프로브가 우회 없이 그냥 커밋됐다.
      #
      # 🔴 **잡지 못하는 것을 함께 적는다**(초안이 여기를 과장했다). `@dg.definitions`를 @asset
      #    모듈에 두어 모듈 스코프 자산이 **조용히 누락**되는 경우는 로드가 성공하므로 이 게이트가
      #    통과시킨다 — 자산이 *적어지는* 것은 오류가 아니다. `@dbt_assets` 셀렉터를 `path:`
      #    글롭으로 써서 모델이 0개 수집되는 경우도 같다. 그래서 CLAUDE.md는 "정의 추가 후
      #    `dg check defs`로 **자산 수를 확인**한다"고 적는다 — 세는 주체는 여전히 사람이다.
      #    (이 두 경우는 프로브로 확인하지 않았다 — 논리적 귀결이라 `미확인`으로 남긴다.)
      #
      # 🔴 DAGSTER_HOME을 **빈 디렉터리**로 돌리는 것이 핵심이다. 저장소의 dagster.yaml은
      #    run/event/schedule storage를 Postgres로 지정하므로, 그대로 두면 정의를 읽기도 전에
      #    인스턴스 로드에서 실제 접속을 시도해 `DagsterPostgresException`으로 죽는다
      #    (2026-08-23 실측). 비우면 기본 로컬 스토리지로 폴백한다.
      # 🔴 아래 크리덴셜은 **전부 가짜다.** common/constants.py가 `os.environ[...]`로 폴백해
      #    미설정 시 KeyError를 내므로 값이 "있기만" 하면 된다 — 접속에는 쓰이지 않는다.
      - name: dg check defs
        working-directory: dagster/dockerfile.d/src
        env:
          DAGSTER_HOME: ${{ runner.temp }}/dagster-home
          POSTGRES_USER: ci-dummy
          POSTGRES_PASSWORD: ci-dummy
          AWS_ACCESS_KEY_ID: ci-dummy
          AWS_SECRET_ACCESS_KEY: ci-dummy
        run: |
          mkdir -p "$DAGSTER_HOME"
          uv run dg check defs
