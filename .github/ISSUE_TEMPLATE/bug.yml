name: 결함 (bug)
description: 코드·설정·스크립트가 선언과 다르게 동작한다
title: "fix(scope): "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        🔴 **인프라 공격 표면·시크릿 노출·가드 우회는 여기 적지 않는다** — 공개 Issue다.
        `docs/security.md`의 직접 연락 경로를 쓴다. 판정 기준은 `docs/doc-sync.md` §실무 규칙 7 축 3.

        ⚠️ **아래 선택은 라벨을 자동으로 붙이지 않는다** — 생성 후 `area:*`·`prio:*`를 직접 붙인다.
        (`bug` 라벨만 템플릿이 고정으로 붙인다.)

  - type: dropdown
    id: area
    attributes:
      label: 영역 (area)
      options:
        - "area:docs — docs/** · README.md · 규약 문서"
        - "area:infra — k8s/** · terraform/** · compose.yml · Dockerfile"
        - "area:pipeline — dagster_project/** · models/** · 적재·변환"
        - "area:agents — .claude/** · .codex/** · 워커·스킬·가드 스크립트"
        - "area:ci — .github/workflows/** · pre-commit · 린트 게이트"
    validations:
      required: true

  - type: dropdown
    id: prio
    attributes:
      label: 우선순위 (prio)
      description: >-
        "얼마나 중요한가"가 아니라 **"먼저 해야 하는가"** 로 고른다.
        판정이 갈리면 낮은 쪽을 고른다 — 전부 high면 순서가 사라진다.
      options:
        - "prio:high — 먼저 한다 (다른 작업을 막거나 방치 비용이 크다)"
        - "prio:medium — 다음 사이클에 한다 (계획된 순서를 따른다)"
        - "prio:low — 열어두되 일정 없음 (착수 시점을 정하지 않는다)"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      description: 실행한 명령을 그대로 적는다. 재현되지 않으면 그 사실을 적는다.
      render: shell
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: 관측된 동작
      description: 출력 원문을 붙인다. 요약하지 않는다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: >-
        **그 기대값의 근거**를 함께 적는다. 어떤 문서·선언이 그렇게 약속했는가.
        (기대값만 적으면 "이분법이 성립하는지"를 아무도 검산하지 못한다.)
    validations:
      required: true

  - type: textarea
    id: not-done
    attributes:
      label: 하지 않은 것
      description: >-
        🔴 좁히지 못한 범위·안 돌려본 경로를 적는다. 비워 두지 않는다.
    validations:
      required: true
