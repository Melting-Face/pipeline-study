---
name: dagster

x-docker-logging: &docker-logging
  logging:
    driver: "json-file"
    options:
      # 로그 파일의 최대 크기 (10MB)
      max-size: "10m"
      # 유지할 로그 파일 개수 (최대 10개)
      max-file: "20"

# 자원 할당 규칙: 서비스마다 특성이 다르므로 deploy.resources 를 개별 명시한다.
# limits=상한(하드), reservations=예약(소프트). podman machine(8CPU/22GiB) 기준 산정.

# dagster webserver·daemon 공통부 (DRY). 둘은 동일 이미지·instance(dagster.yaml)·
# Postgres 공유 storage로 협조하며, entrypoint/command/포트/자원만 서비스별로 다르다.
x-dagster-common: &dagster-common
  build:
    context: dagster/dockerfile.d/
  environment:
    # 로그·프로세스 로컬 시간을 KST로 (스케줄 해석은 execution_timezone이 담당, 저장은 UTC 유지)
    - TZ=Asia/Seoul
    # 컨테이너에서는 항상 compose 서비스명으로 접속한다(호스트 실행 시엔 .env의 localhost).
    - POSTGRES_HOST=postgres
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_DB=${POSTGRES_DB}
    - POSTGRES_PORT=${POSTGRES_PORT}
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    - ENDPOINT_URL=${ENDPOINT_URL}
    # SeaweedFS는 AWS SDK의 aws-chunked 체크섬 업로드를 못 푼다(객체가 깨진다).
    - AWS_REQUEST_CHECKSUM_CALCULATION=${AWS_REQUEST_CHECKSUM_CALCULATION:-when_required}
    - AWS_RESPONSE_CHECKSUM_VALIDATION=${AWS_RESPONSE_CHECKSUM_VALIDATION:-when_required}
  volumes:
    - ./shared:/shared
  depends_on:
    postgres:
      condition: service_healthy

services:
  # UI/GraphQL 전용. workspace.yaml로 코드 로케이션을 명시 로드한다.
  #
  # 🔴 정본은 **in-cluster**다(k8s/dagster/). 여기 정의는 상시 기동에서 빠지고
  #   `--profile host-dagster`로만 뜬다 — trino·seaweedfs와 같은 "중단과 삭제의 분리"다.
  #   자원은 즉시 회수하되 롤백 비용은 0으로 남긴다.
  # ⚠️ 이걸 in-cluster와 **동시에 띄우지 마라.** 같은 서비스가 두 환경에 살아 있으면
  #   관측 확인(①타깃 ②up ③로그)을 전부 통과하면서 레거시가 정본 대신 답한다
  #   (docs/conventions/monitoring.md §3-④ — 이 저장소에서 이미 2회 발생).
  dagster-webserver:
    <<: [*docker-logging, *dagster-common]
    container_name: dagster-webserver
    profiles: ["host-dagster"]
    entrypoint: ["dagster-webserver"]
    command: ["-h", "0.0.0.0", "-p", "${DAGSTER_PORT}", "-w", "workspace.yaml"]
    ports:
      - ${DAGSTER_PORT}:${DAGSTER_PORT}
    # UI/GraphQL: 가벼움 (run 실행은 daemon 쪽)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 768M
  # 스케줄·센서·런큐 처리 + DefaultRunLauncher로 run을 서브프로세스 실행(무거움).
  # webserver와 같은 profile — 둘은 storage를 공유해야 하므로 항상 함께 뜨고 함께 내린다.
  dagster-daemon:
    <<: [*docker-logging, *dagster-common]
    container_name: dagster-daemon
    profiles: ["host-dagster"]
    entrypoint: ["dagster-daemon"]
    command: ["run", "-w", "workspace.yaml"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1536M
  # 🔴 Dagster 메타 스토리지의 정본은 **CNPG의 `dagster` DB**로 옮겨갔다
  #   (k8s/dagster/dagster-meta-db.yaml). 이 컨테이너를 상시 기동으로 두면 호스트 `dg dev`가
  #   여기에, 클러스터가 CNPG에 써서 **run 이력이 두 벌로 갈린다** — 정의만 남기고 내린다.
  #   호스트 개발 루프는 CNPG를 보게 한다:
  #     kubectl port-forward svc/catalog-postgres-rw 15432:5432
  #     POSTGRES_HOST=localhost POSTGRES_PORT=15432 POSTGRES_DB=dagster
  # profiles가 셋인 이유: 의존받는 서비스는 **의존하는 쪽의 profile을 전부 물려받는다**
  #   (dagster-* = host-dagster · trino = legacy-sql). legacy-meta는 이 컨테이너 단독 기동용.
  postgres:
    <<: *docker-logging
    container_name: postgres
    image: postgres:15
    profiles: ["legacy-meta", "host-dagster", "legacy-sql"]
    # 호스트에서 이 DB에 붙을 때를 위해 노출한다.
    # 루프백 바인딩으로 외부 노출은 막는다(docs/security.md — 최소 노출).
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      # - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 8s
      retries: 5
    # RDB: 캐시·shared_buffers 위해 안정적 메모리 예약, CPU는 중간
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
  # 레거시 SQL 엔진(옵션): `--profile legacy-sql` 로만 기동. 뼈대(core)는 profile 없음 → 항상 실행.
  #
  # 재설계에서 Trino는 **제거 대상**이고(docs/architectures/trino.md · docs/redesign.md §5)
  # dbt는 dbt-spark, ad-hoc 조회는 Spark SQL로 간다. 다만 22모델 방언 교정이 끝나기 전까지
  # Trino는 **값 대조의 정본**("도는 것"이 아니라 "같은 값")이라 정의 자체는 남긴다.
  # → 상시 기동만 끊어 자원(3 CPU / 6G)을 회수하고, 대조가 필요할 때만 올린다.
  #   docker compose --profile legacy-sql up -d trino
  trino:
    <<: *docker-logging
    container_name: trino
    profiles: ["legacy-sql"]
    image: trinodb/trino:468
    ports:
      # 호스트 8080은 kind ingress(k8s/kind-cluster.yaml extraPortMappings)가 점유한다.
      # 컨테이너 내부 포트는 8080 그대로라 dbt profiles.yml(host: trino, port: 8080)은 영향 없다.
      - "8081:8080"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      # 카탈로그 정의만 읽기전용 마운트 (비밀정보는 ${ENV:..}로 치환)
      - ./trino/etc/catalog:/etc/trino/catalog:ro
      # 힙 비율 조정용 커스텀 jvm.config (나머지 설정은 이미지 기본값 사용)
      - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    # JVM 기반 MPP 쿼리엔진: 힙·쿼리 처리로 메모리/CPU 최다 소비 (jvm.config Xmx는 한도 내 유지)
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 6G
        reservations:
          cpus: "1.0"
          memory: 2G
  # SeaweedFS standalone: master/volume/filer/s3를 단일 컨테이너로 통합
  #
  # 오브젝트 스토리지 정본은 **K8s SeaweedFS**로 이전됐다(redesign Phase 1 · `k8s/seaweedfs.yaml`).
  # 원천 csv.gz도 2026-08-19에 전량 K8s로 이관·CRC 검증을 마쳤다 → 상시 기동할 이유가 없다.
  # trino와 같은 취지로 **정의는 남기고 상시 기동만 끊는다**("중단"과 "삭제"의 분리).
  #   docker compose --profile legacy-storage up -d seaweedfs
  # 로컬 데이터 `./seaweedfs/data`(309MB, 이관 전 원본)는 바인드 마운트라 그대로 남아 있다.
  #
  # profile 3개인 이유: `trino`(legacy-sql)와 `prometheus`(monitoring)가 **이 서비스에 의존**한다
  # (prometheus는 `seaweedfs:9324` 메트릭을 수집). 의존 서비스의 profile을 함께 걸지 않으면
  # 그 profile만 켰을 때 의존이 비활성이라 기동이 깨진다.
  seaweedfs:
    <<: *docker-logging
    container_name: seaweedfs
    profiles: ["legacy-storage", "legacy-sql", "monitoring"]
    image: chrislusf/seaweedfs # use a remote image
    ports:
      - 9333:9333 # master UI
      - 8333:8333 # S3 API
      - 8888:8888 # filer UI
      - 23646:23646
      # volume(8080)·grpc·metrics(9324)는 컨테이너 네트워크 내부 통신만 사용 → host 미게시 (Trino 8080 충돌 회피)
    command: "mini -ip.bind=0.0.0.0 -dir=/data -metricsPort=9324"
    volumes:
      - ./seaweedfs/data:/data
    # 오브젝트 스토리지: IO 위주, CPU 낮고 메모리 모자란 편 아님
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
  # 모니터링(옵션): `--profile monitoring` 으로만 기동. 뼈대(core)는 profile 없음 → 항상 실행.
  prometheus:
    <<: *docker-logging
    container_name: prometheus
    profiles: ["monitoring"]
    image: prom/prometheus:v2.21.0
    ports:
      - 9000:9090
    volumes:
      - ./prometheus:/etc/prometheus
    command: "--web.enable-lifecycle --config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - seaweedfs
    # TSDB: 시계열 수·보존기간에 따라 메모리 증가, CPU는 낮음
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
