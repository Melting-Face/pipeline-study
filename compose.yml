---
name: dagster

x-docker-logging: &docker-logging
  logging:
    driver: "json-file"
    options:
      # 로그 파일의 최대 크기 (10MB)
      max-size: "10m"
      # 유지할 로그 파일 개수 (최대 10개)
      max-file: "20"

# 자원 할당 규칙: 서비스마다 특성이 다르므로 deploy.resources 를 개별 명시한다.
# limits=상한(하드), reservations=예약(소프트). podman machine(8CPU/22GiB) 기준 산정.

# dagster webserver·daemon 공통부 (DRY). 둘은 동일 이미지·instance(dagster.yaml)·
# Postgres 공유 storage로 협조하며, entrypoint/command/포트/자원만 서비스별로 다르다.
x-dagster-common: &dagster-common
  build:
    context: dagster/dockerfile.d/
  environment:
    # 로그·프로세스 로컬 시간을 KST로 (스케줄 해석은 execution_timezone이 담당, 저장은 UTC 유지)
    - TZ=Asia/Seoul
    # 컨테이너에서는 항상 compose 서비스명으로 접속한다(호스트 실행 시엔 .env의 localhost).
    - POSTGRES_HOST=postgres
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_DB=${POSTGRES_DB}
    - POSTGRES_PORT=${POSTGRES_PORT}
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    - ENDPOINT_URL=${ENDPOINT_URL}
    # S3(스택 A docker_container.seaweedfs)는 compose 네트워크 밖이라 서비스명이 안 풀린다 —
    # 컨테이너에서는 항상 호스트 루프백 게시 포트로 닿는다(호스트 실행 시엔 .env의 localhost).
    - ICEBERG_S3_ENDPOINT=http://host.containers.internal:8333
    # 🔴 컨테이너 Dagster의 dbt·유지보수(Trino)는 **미지원**이다. 코드 기본값 `trino.localtest.me`는
    # 컨테이너 안에서 자기 루프백이라 접속 실패(거부·이름 해석)로 끝난다(조용히 틀리지 않는다). 컨테이너는
    # ICEBERG_CATALOG_*를 받지 않아 compose postgres 카탈로그를 보므로, k8s Trino로 돌리면 카탈로그가
    # 어긋난다. 정본 실행처는 호스트 `dg dev`다.
    # PhysioNet credentialed 원천 접근(수집 자산). 비어 있어도 정의 로드는
    # 성공하고 수집 자산 실행에서만 실패한다 — 코드가 dg.EnvVar로 받는다.
    - PHYSIONET_USERNAME=${PHYSIONET_USERNAME:-}
    - PHYSIONET_PASSWORD=${PHYSIONET_PASSWORD:-}
    # 금융 시장 원천(주식예측). 같은 이유로 `:-` 폴백을 둔다.
    # (in-cluster Dagster는 철거돼 이 compose/호스트 경로가 유일한 실행처다.)
    - POLYGON_API_KEY=${POLYGON_API_KEY:-}
    - FRED_API_KEY=${FRED_API_KEY:-}
    # SEC EDGAR 폴백 시에만 쓰인다(연락처 포함 UA). 비밀 아님.
    - NEWS_RSS_USER_AGENT=${NEWS_RSS_USER_AGENT:-}
    # SeaweedFS는 AWS SDK의 aws-chunked 체크섬 업로드를 못 푼다(객체가 깨진다).
    - AWS_REQUEST_CHECKSUM_CALCULATION=${AWS_REQUEST_CHECKSUM_CALCULATION:-when_required}
    - AWS_RESPONSE_CHECKSUM_VALIDATION=${AWS_RESPONSE_CHECKSUM_VALIDATION:-when_required}
  volumes:
    - ./shared:/shared
  depends_on:
    postgres:
      condition: service_healthy

services:
  # SeaweedFS(오브젝트 스토리지 정본)는 이 compose에 없다 — 스택 A `docker_container.seaweedfs`
  # (terraform apply)가 소유한다. 컨테이너 이름 `seaweedfs`, 포트는 127.0.0.1에만 게시된다.
  # compose 서비스는 `host.containers.internal:<게시 포트>`로 닿는다(S3 8333).
  # 메트릭 9324는 in-cluster Prometheus(gitops/charts/prometheus)가 kind 네트워크 별칭 `seaweedfs-ext`로 긁는다.

  # UI/GraphQL 전용. workspace.yaml로 코드 로케이션을 명시 로드한다.
  #
  # in-cluster Dagster(k8s/dagster/)는 ArgoCD 전환으로 철거돼 호스트 경로가 유일한 실행처다.
  #   상시 기동에서는 빠지고 `--profile host-dagster`로만 뜬다(opt-in).
  # ⚠️ 이걸 in-cluster와 **동시에 띄우지 마라.** 같은 서비스가 두 환경에 살아 있으면
  #   관측 확인(①타깃 ②up ③로그)을 전부 통과하면서 레거시가 정본 대신 답한다
  #   (docs/conventions/monitoring.md §3-④ — 이 저장소에서 이미 2회 발생).
  dagster-webserver:
    <<: [*docker-logging, *dagster-common]
    container_name: dagster-webserver
    profiles: ["host-dagster"]
    entrypoint: ["dagster-webserver"]
    command: ["-h", "0.0.0.0", "-p", "${DAGSTER_PORT}", "-w", "workspace.yaml"]
    # 호스트에서 UI에 붙을 때를 위해 노출하되, 루프백 바인딩으로 LAN 도달은 막는다
    # (docs/security.md — 최소 노출). UI와 같은 포트로 쓰기 가능한 API가 함께 나가고
    # 인증 배선이 없어, 호스트 밖으로 낼 이유가 없다.
    ports:
      - "127.0.0.1:${DAGSTER_PORT}:${DAGSTER_PORT}"
    # UI/GraphQL: 가벼움 (run 실행은 daemon 쪽)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 768M
  # 스케줄·센서·런큐 처리 + DefaultRunLauncher로 run을 서브프로세스 실행(무거움).
  # webserver와 같은 profile — 둘은 storage를 공유해야 하므로 항상 함께 뜨고 함께 내린다.
  dagster-daemon:
    <<: [*docker-logging, *dagster-common]
    container_name: dagster-daemon
    profiles: ["host-dagster"]
    entrypoint: ["dagster-daemon"]
    command: ["run", "-w", "workspace.yaml"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1536M
  # 🔴 Dagster 메타 DB — 구 `lakehouse` 클러스터에서는 CNPG `dagster` DB였고 그 선언
  #   (k8s/dagster/dagster-meta-db.yaml)은 철거됐다(롤만 남음). 새 클러스터에는 메타 DB가 없고
  #   위치는 PR2가 정한다. 그동안 `--profile host-dagster`는 이 컨테이너를 쓴다(앵커 POSTGRES_HOST=postgres).
  #   호스트 `dg dev`는 .env의 POSTGRES_HOST/PORT를 따른다 — 예시 기본값(15432)은 구 클러스터 CNPG의
  #   port-forward라, 이 컨테이너와 섞어 쓰면 **run 이력이 두 벌로 갈린다**. 단일 서술: docs/operations.md §1-2
  # profiles가 둘인 이유: 의존받는 서비스는 **의존하는 쪽의 profile을 전부 물려받는다**
  #   (dagster-* = host-dagster). legacy-meta는 이 컨테이너 단독 기동용.
  postgres:
    <<: *docker-logging
    container_name: postgres
    image: postgres:15
    profiles: ["legacy-meta", "host-dagster"]
    # 호스트에서 이 DB에 붙을 때를 위해 노출한다.
    # 루프백 바인딩으로 외부 노출은 막는다(docs/security.md — 최소 노출).
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      # - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 8s
      retries: 5
    # RDB: 캐시·shared_buffers 위해 안정적 메모리 예약, CPU는 중간
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
