---
name: dagster

x-docker-logging: &docker-logging
  logging:
    driver: "json-file"
    options:
      # 로그 파일의 최대 크기 (10MB)
      max-size: "10m"
      # 유지할 로그 파일 개수 (최대 10개)
      max-file: "20"

# 자원 할당 규칙: 서비스마다 특성이 다르므로 deploy.resources 를 개별 명시한다.
# limits=상한(하드), reservations=예약(소프트). podman machine(8CPU/22GiB) 기준 산정.

# dagster webserver·daemon 공통부 (DRY). 둘은 동일 이미지·instance(dagster.yaml)·
# Postgres 공유 storage로 협조하며, entrypoint/command/포트/자원만 서비스별로 다르다.
x-dagster-common: &dagster-common
  build:
    context: dagster/dockerfile.d/
  environment:
    # 로그·프로세스 로컬 시간을 KST로 (스케줄 해석은 execution_timezone이 담당, 저장은 UTC 유지)
    - TZ=Asia/Seoul
    # 컨테이너에서는 항상 compose 서비스명으로 접속한다(호스트 실행 시엔 .env의 localhost).
    - POSTGRES_HOST=postgres
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_DB=${POSTGRES_DB}
    - POSTGRES_PORT=${POSTGRES_PORT}
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    - ENDPOINT_URL=${ENDPOINT_URL}
    # S3(스택 A docker_container.seaweedfs)는 compose 네트워크 밖이라 서비스명이 안 풀린다 —
    # 컨테이너에서는 항상 호스트 루프백 게시 포트로 닿는다(호스트 실행 시엔 .env의 localhost).
    - ICEBERG_S3_ENDPOINT=http://host.containers.internal:8333
    # Trino(dbt·유지보수). 코드 기본값 `trino.localtest.me`는 컨테이너 안에서 자기 루프백으로
    # 풀린다. 게다가 컨테이너 Dagster는 ICEBERG_CATALOG_*를 받지 않아 **compose postgres
    # 카탈로그**를 보므로, 짝이 맞는 엔진은 같은 카탈로그를 보는 compose Trino(`legacy-sql`)다.
    # k8s Trino(CNPG 카탈로그)로 돌리면 dbt와 적재가 서로 다른 카탈로그 DB를 본다.
    - TRINO_HOST=trino
    - TRINO_PORT=8080
    # PhysioNet credentialed 원천 접근(수집 자산). 비어 있어도 정의 로드는
    # 성공하고 수집 자산 실행에서만 실패한다 — 코드가 dg.EnvVar로 받는다.
    - PHYSIONET_USERNAME=${PHYSIONET_USERNAME:-}
    - PHYSIONET_PASSWORD=${PHYSIONET_PASSWORD:-}
    # 금융 시장 원천(주식예측). 같은 이유로 `:-` 폴백을 둔다.
    # (in-cluster Dagster는 철거돼 이 compose/호스트 경로가 유일한 실행처다.)
    - POLYGON_API_KEY=${POLYGON_API_KEY:-}
    - FRED_API_KEY=${FRED_API_KEY:-}
    # SEC EDGAR 폴백 시에만 쓰인다(연락처 포함 UA). 비밀 아님.
    - NEWS_RSS_USER_AGENT=${NEWS_RSS_USER_AGENT:-}
    # SeaweedFS는 AWS SDK의 aws-chunked 체크섬 업로드를 못 푼다(객체가 깨진다).
    - AWS_REQUEST_CHECKSUM_CALCULATION=${AWS_REQUEST_CHECKSUM_CALCULATION:-when_required}
    - AWS_RESPONSE_CHECKSUM_VALIDATION=${AWS_RESPONSE_CHECKSUM_VALIDATION:-when_required}
  volumes:
    - ./shared:/shared
  depends_on:
    postgres:
      condition: service_healthy

services:
  # UI/GraphQL 전용. workspace.yaml로 코드 로케이션을 명시 로드한다.
  #
  # in-cluster Dagster(k8s/dagster/)는 ArgoCD 전환으로 철거돼 호스트 경로가 유일한 실행처다.
  #   상시 기동에서는 빠지고 `--profile host-dagster`로만 뜬다(opt-in).
  # ⚠️ 이걸 in-cluster와 **동시에 띄우지 마라.** 같은 서비스가 두 환경에 살아 있으면
  #   관측 확인(①타깃 ②up ③로그)을 전부 통과하면서 레거시가 정본 대신 답한다
  #   (docs/conventions/monitoring.md §3-④ — 이 저장소에서 이미 2회 발생).
  dagster-webserver:
    <<: [*docker-logging, *dagster-common]
    container_name: dagster-webserver
    profiles: ["host-dagster"]
    entrypoint: ["dagster-webserver"]
    command: ["-h", "0.0.0.0", "-p", "${DAGSTER_PORT}", "-w", "workspace.yaml"]
    # 호스트에서 UI에 붙을 때를 위해 노출하되, 루프백 바인딩으로 LAN 도달은 막는다
    # (docs/security.md — 최소 노출). UI와 같은 포트로 쓰기 가능한 API가 함께 나가고
    # 인증 배선이 없어, 호스트 밖으로 낼 이유가 없다.
    ports:
      - "127.0.0.1:${DAGSTER_PORT}:${DAGSTER_PORT}"
    # UI/GraphQL: 가벼움 (run 실행은 daemon 쪽)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 768M
  # 스케줄·센서·런큐 처리 + DefaultRunLauncher로 run을 서브프로세스 실행(무거움).
  # webserver와 같은 profile — 둘은 storage를 공유해야 하므로 항상 함께 뜨고 함께 내린다.
  dagster-daemon:
    <<: [*docker-logging, *dagster-common]
    container_name: dagster-daemon
    profiles: ["host-dagster"]
    entrypoint: ["dagster-daemon"]
    command: ["run", "-w", "workspace.yaml"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1536M
  # 🔴 Dagster 메타 DB — 구 `lakehouse` 클러스터에서는 CNPG `dagster` DB였고 그 선언
  #   (k8s/dagster/dagster-meta-db.yaml)은 철거됐다(롤만 남음). 새 클러스터에는 메타 DB가 없고
  #   위치는 PR2가 정한다. 그동안 `--profile host-dagster`는 이 컨테이너를 쓴다(앵커 POSTGRES_HOST=postgres).
  #   호스트 `dg dev`는 .env의 POSTGRES_HOST/PORT를 따른다 — 예시 기본값(15432)은 구 클러스터 CNPG의
  #   port-forward라, 이 컨테이너와 섞어 쓰면 **run 이력이 두 벌로 갈린다**. 단일 서술: docs/operations.md §1-2
  # profiles가 셋인 이유: 의존받는 서비스는 **의존하는 쪽의 profile을 전부 물려받는다**
  #   (dagster-* = host-dagster · trino = legacy-sql). legacy-meta는 이 컨테이너 단독 기동용.
  postgres:
    <<: *docker-logging
    container_name: postgres
    image: postgres:15
    profiles: ["legacy-meta", "host-dagster", "legacy-sql"]
    # 호스트에서 이 DB에 붙을 때를 위해 노출한다.
    # 루프백 바인딩으로 외부 노출은 막는다(docs/security.md — 최소 노출).
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      # - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 8s
      retries: 5
    # RDB: 캐시·shared_buffers 위해 안정적 메모리 예약, CPU는 중간
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
  # 레거시 SQL 엔진(옵션): `--profile legacy-sql` 로만 기동. 뼈대(core)는 profile 없음 → 항상 실행.
  #
  # 재설계에서 Trino는 **제거 대상**이고(docs/architectures/trino.md · docs/redesign.md §5)
  # dbt는 dbt-spark, ad-hoc 조회는 Spark SQL로 간다. 다만 22모델 방언 교정이 끝나기 전까지
  # Trino는 **값 대조의 정본**("도는 것"이 아니라 "같은 값")이라 정의 자체는 남긴다.
  # → 상시 기동만 끊어 자원(3 CPU / 6G)을 회수하고, 대조가 필요할 때만 올린다.
  #   docker compose --profile legacy-sql up -d trino
  trino:
    <<: *docker-logging
    container_name: trino
    profiles: ["legacy-sql"]
    image: trinodb/trino:468
    # 호스트에서 쿼리·UI에 붙을 때를 위해 노출하되, 루프백 바인딩으로 LAN 도달은 막는다
    # (docs/security.md — 최소 노출). 이 엔진 뒤에는 재배포가 제한된 원천 데이터가 있고
    # 인증 배선이 없어, 호스트 밖으로 낼 이유가 없다.
    ports:
      # 호스트 8080은 kind ingress(terraform/cluster/kind의 호스트 포트 매핑)가 점유한다.
      # 컨테이너 내부 포트는 8080 그대로다 — compose Dagster는 앵커의 TRINO_HOST=trino·TRINO_PORT=8080으로
      # 붙는다(호스트에서 붙을 때는 127.0.0.1:8081, dbt profiles.yml의 env 두 값을 한 벌로).
      - "127.0.0.1:8081:8080"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      # 카탈로그 정의만 읽기전용 마운트 (비밀정보는 ${ENV:..}로 치환)
      - ./trino/etc/catalog:/etc/trino/catalog:ro
      # 힙 비율 조정용 커스텀 jvm.config (나머지 설정은 이미지 기본값 사용)
      - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
    depends_on:
      postgres:
        condition: service_healthy
    # S3(SeaweedFS)는 이 compose 밖 — 스택 A `docker_container.seaweedfs`(terraform apply)가 소유한다.
    # compose 의존으로 표현할 수 없으므로 기동 순서는 운영자가 보장한다(스택 A 먼저).
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    # JVM 기반 MPP 쿼리엔진: 힙·쿼리 처리로 메모리/CPU 최다 소비 (jvm.config Xmx는 한도 내 유지)
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 6G
        reservations:
          cpus: "1.0"
          memory: 2G
  # SeaweedFS(오브젝트 스토리지 정본)는 이 compose에 없다 — 스택 A `docker_container.seaweedfs`
  # (terraform apply)가 소유한다. 컨테이너 이름 `seaweedfs`, 포트는 127.0.0.1에만 게시된다.
  # compose 서비스는 `host.containers.internal:<게시 포트>`로 닿는다(S3 8333·메트릭 9324).
  # 모니터링(옵션): `--profile monitoring` 으로만 기동. 뼈대(core)는 profile 없음 → 항상 실행.
  prometheus:
    <<: *docker-logging
    container_name: prometheus
    profiles: ["monitoring"]
    image: prom/prometheus:v2.21.0
    # 호스트에서 메트릭·UI를 볼 때를 위해 노출하되, 루프백 바인딩으로 LAN 도달은 막는다
    # (docs/security.md — 최소 노출). 수집한 메트릭에 내부 구성이 드러나고 lifecycle API가
    # 함께 열려 있어, 호스트 밖으로 낼 이유가 없다.
    ports:
      - "127.0.0.1:9000:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    command: "--web.enable-lifecycle --config.file=/etc/prometheus/prometheus.yml"
    # 수집 대상 seaweedfs는 스택 A `docker_container.seaweedfs`(terraform apply) — compose 의존 없음.
    # TSDB: 시계열 수·보존기간에 따라 메모리 증가, CPU는 낮음
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
