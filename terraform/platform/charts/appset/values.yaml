# argocd.tf 의 helm_release.appset 이 values 로 repoUrl·targetRevision 을 덮어쓴다. 나머지는
# 이 프로젝트 레이아웃이 고정값이라 기본값 그대로 쓴다. 앱 목록은 values 가 아니라
# git(gitops/apps/*/config.yaml)이 정본이다 - files generator 가 직접 읽는다.
namespace: argocd
# 필수값 - 비워 두면 helm template 이 실패한다(templates/applicationset.yaml 주석 참고).
repoUrl: ""
# argocd.tf 가 var.target_revision 을 넘긴다. 기본값은 main. generator(설정 파일)와 source(차트) 양쪽이 이 리비전을 읽는다.
targetRevision: main
