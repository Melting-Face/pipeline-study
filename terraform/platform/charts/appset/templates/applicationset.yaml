# apps ApplicationSet - git files generator 가 gitops/apps/<app>/config.yaml 마다 Application 하나를 만든다
# (앱 목록의 정본은 git 이다 - 앱 추가 = 설정 파일 커밋 하나, terraform apply 불필요. docs/argocd-gitops.md §3).
# 설정 파일 스키마·검사는 scripts/gitops-apps-check.sh 머리 주석이 정본이다.
#
# 🔴 템플릿이 두 겹이다 - 누가 채우는지를 구분한다:
#   - repoURL·targetRevision 은 Helm 이 .Values 로 채운다(이스케이프 불필요).
#   - 설정 파일 필드(name·namespace·tier·source.*)와 files generator 가 주입하는 path 객체 자리(이중 중괄호
#     표현식)는 ApplicationSet 컨트롤러가 채운다. Helm 이 먼저 해석하면 값이 없어 렌더가 깨지거나 빈 값이
#     되므로, 백틱 raw 문자열로 감싸 Helm 이 건드리지 않고 그대로 통과시킨다.
#     (ArgoCD "Template" 문서가 Helm 으로 ApplicationSet 을 배포할 때 권하는 형태)
#   - files generator 는 설정 파일 위치를 path 라는 최상위 파라미터(객체)로 주입한다. 그래서 설정 파일에
#     최상위 path 키를 두면 충돌한다 - 검사기 (a)가 알 수 없는 키로 막는다.
#
# 🔴 주석 안에도 이중 중괄호를 쓰지 않는다 - Helm 은 YAML 주석 안의 표현식도 해석한다(주석에 표현식을
# 쓰면 렌더 결과에서 빈 문자열로 사라질 수 있다 - argocd-study 에서 겪은 증상).
#
# 🔴 repoUrl 은 required 로 막는다 - 기본값 빈 문자열이면 helm lint(--strict 포함)는 WARN 만
# 내고 통과하지만 helm template 은 실패한다(argocd-study 에서 확인한 동작).
#
# 🔴 source 는 template 이 아니라 templatePatch 가 source.type 으로 골라 넣는다:
#   umbrella - 이 저장소 gitops/charts/<앱> (기존 7개)
#   upstream - 상류 차트 + 같은 디렉터리 values.yaml 을 $values ref 로 읽는 multi-source(새 앱부터)
#   그 밖의 값은 fail 로 생성 자체를 막는다(조용히 source 없는 Application 이 생기지 않게).
#
# 🔴 strategy RollingSync - tier 라벨 "0" → "1" → "2" 순으로, 앞 단계가 Healthy 가 된 뒤 다음 단계를 sync 한다.
# 컨트롤러 파라미터 applicationsetcontroller.enable.progressive.syncs 가 켜져 있어야 동작한다
# (terraform/platform/values/argocd.yaml.tftpl). 🔴 대가: RollingSync 는 생성 Application 의 자동 sync 를 강제로 끈다
# (ArgoCD v3.5 Progressive Syncs 문서) - 아래 automated 블록은 RollingSync 를 걷어낼 때 원상 복귀용으로 남긴다.
# 수용 사유·재검토 조건은 docs/argocd-gitops.md D5 개정 기록. steps 의 tier 값 집합은 검사기 (d)와 같아야 한다.
#
# 🔴 spec.syncPolicy:
#   - preserveResourcesOnDeletion - ApplicationSet·Application 이 지워질 때 하위 리소스를 연쇄 삭제하지 않는다(§4 겹 1).
#   - applicationsSync: create-update - generator 결과에서 빠진 Application 을 지우지 않는다(생성·갱신만).
#     설정 파일 오삭제나 generator 0건(저장소 fetch 이상)이 7앱 삭제로 번지지 않게 하는 겹이다.
#     앱을 정말 내릴 때는 설정 파일 삭제 뒤 Application 을 손으로 지운다(docs/argocd-gitops.md 「앱 추가·제거」).
#
# 🔴 syncPolicy 는 block-style 로 쓴다 - 빈 맵이나 flow-style 맵은 ArgoCD 가 정규화하며
# 영구 드리프트를 만든다(docs/argocd-gitops.md §5 - argocd-study appset 템플릿의 같은 주의).
#
# goTemplateOptions missingkey=error: 설정 파일에 키가 빠졌을 때 빈 값으로 조용히 넘어가지 않고 오류로 드러낸다.
{{- $repoUrl := required "repoUrl 은 필수값이다 - values.yaml 기본값이 빈 문자열이면 helm lint 는 통과하지만 ApplicationSet 이 빈 repoURL 로 렌더된다" .Values.repoUrl }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: "{{ .Values.namespace }}"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
    applicationsSync: create-update
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: "{{ $repoUrl }}"
        revision: "{{ .Values.targetRevision }}"
        files:
          - path: gitops/apps/*/config.yaml
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: tier
              operator: In
              values:
                - "0"
        - matchExpressions:
            - key: tier
              operator: In
              values:
                - "1"
        - matchExpressions:
            - key: tier
              operator: In
              values:
                - "2"
  template:
    metadata:
      name: '{{`{{ .name }}`}}'
      labels:
        tier: '{{`{{ .tier }}`}}'
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{`{{ .namespace }}`}}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          # 큰 CRD 의 last-applied annotation 크기 한도(262144 bytes)를 피한다.
          - ServerSideApply=true
          # 아직 설치되지 않은 리소스 타입은 dry-run 을 생략한다(CRD 보다 CR 이 먼저 sync 될 때).
          - SkipDryRunOnMissingResource=true
        # 같은 tier 안의 순서는 확정적이지 않다 - CRD 가 아직 없어 실패한 앱은 재시도로 수렴한다.
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
  templatePatch: |
    spec:
    {{`{{- if eq .source.type "umbrella" }}`}}
      source:
        repoURL: "{{ $repoUrl }}"
        targetRevision: "{{ .Values.targetRevision }}"
        path: {{`{{ .source.path | quote }}`}}
    {{`{{- else if eq .source.type "upstream" }}`}}
      sources:
        - repoURL: {{`{{ .source.repoURL | quote }}`}}
          chart: {{`{{ .source.chart | quote }}`}}
          targetRevision: {{`{{ .source.targetRevision | quote }}`}}
          helm:
            valueFiles:
              - {{`{{ printf "$values/%s/values.yaml" .path.path | quote }}`}}
        - repoURL: "{{ $repoUrl }}"
          targetRevision: "{{ .Values.targetRevision }}"
          ref: values
    {{`{{- else }}`}}
    {{`{{- fail (printf "source.type %q 는 umbrella·upstream 중 하나여야 한다" .source.type) }}`}}
    {{`{{- end }}`}}
