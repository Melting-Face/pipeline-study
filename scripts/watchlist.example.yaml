# Discord 알림 관심목록 예제 — 형식만 보여 준다(벤더·제품은 가짜 값).
#
# 🔴 실제 목록은 저장소 밖에 둔다. 경로는 env `ALERTS_WATCHLIST_PATH`로 넘긴다.
#    읽는 코드는 images/airflow/dags/lakehouse/alerts.py `load_watchlist`다.
# - 최상위 키는 `products` 하나, 항목은 `vendor`·`product` 두 키다.
#   어긋나거나 목록이 비면 DAG가 실패한다(fail-closed).
# - 비교는 소문자로 한다.
# - CPE 표기(`vendor:product`, 예 `examplecorp:widget_server`)와 KEV 표기
#   (`vendorProject`·`product`, 예 `ExampleCorp`·`Widget Server`)가 다르다.
#   양쪽에서 잡으려면 두 표기를 모두 적는다.
products:
  - vendor: examplecorp
    product: widget_server
  - vendor: ExampleCorp
    product: Widget Server
  - vendor: sampleware
    product: sample_gateway
