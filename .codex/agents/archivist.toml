name = "archivist"
description = "기록관(archivist) — 미션 저널의 정합성·누락을 점검하고 미션 MOC(대시보드)를 유지한다. 판단·실행 작업은 하지 않고 관측·기록만 한다. 미션 종료 시점이나 여러 워커가 남긴 저널을 취합·검증할 때 사용."
sandbox_mode = "workspace-write"
