# 렌더 결과에 대한 기대 — scripts/gitops-charts-check.sh (c)
# owner 는 Secret catalog-pg-app 의 username 과 같아야 한다(scripts/k8s-secrets.sh 의 owner 가드).
# managed.roles 는 iceberg(0)·airflow(1) 둘 — 오케스트레이터 메타 롤은 iceberg와 분리한다(index 2 = 부재).
fields:
    - {ref: Cluster/catalog-postgres, path: [spec, bootstrap, initdb, owner], value: iceberg}
    - {ref: Cluster/catalog-postgres, path: [spec, managed, roles, 0, name], value: iceberg}
    - {ref: Cluster/catalog-postgres, path: [spec, managed, roles, 1, name], value: airflow}
    - {ref: Cluster/catalog-postgres, path: [spec, managed, roles, 1, passwordSecret, name], value: airflow-pg-app}
    - {ref: Cluster/catalog-postgres, path: [spec, managed, roles, 1, connectionLimit], value: -1}
    - {ref: Cluster/catalog-postgres, path: [spec, managed, roles, 1, inherit], value: true}
    - {ref: Cluster/catalog-postgres, path: [spec, managed, roles, 2], value: null}
    - {ref: Database/airflow, path: [spec, owner], value: airflow}
    - {ref: Database/airflow, path: [spec, name], value: airflow}
    - {ref: Database/airflow, path: [spec, ensure], value: present}
    - {ref: Database/airflow, path: [spec, databaseReclaimPolicy], value: retain}
    - {ref: Database/airflow, path: [spec, cluster, name], value: catalog-postgres}
    - {ref: Database/airflow, path: [metadata, annotations, argocd.argoproj.io/sync-options], value: "Prune=false,Delete=false"}
    # CNPG 웹훅이 채우는 기본값을 명시한다 — 빠지면 ArgoCD가 OutOfSync로 남아 selfHeal이 5분마다 재동기화한다(가설)
    - {ref: Cluster/catalog-postgres, path: [spec, managed, roles, 0, connectionLimit], value: -1}
    - {ref: Cluster/catalog-postgres, path: [spec, managed, roles, 0, inherit], value: true}
    - {ref: Cluster/catalog-postgres, path: [metadata, annotations, argocd.argoproj.io/sync-options], value: "Prune=false,Delete=false"}
