# 서브차트(cert-manager) 값 — 업스트림 키는 `cert-manager:` 아래에 둔다.
cert-manager:
    crds:
        enabled: true
        keep: true  # 기본값이지만 명시 — CRD 삭제는 CR 전부를 지운다(docs/argocd-gitops.md §4 겹 3)
    resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 128Mi}
    webhook:
        resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
    cainjector:
        resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
    startupapicheck:
        resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
