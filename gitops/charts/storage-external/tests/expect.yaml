# 렌더 결과에 대한 기대 — scripts/gitops-charts-check.sh (c)
# 파드가 쓰는 엔드포인트 http://seaweedfs:8333 은 이 Service 이름이 받는다. 대상 별칭은
# terraform/cluster/kind(docker_container.seaweedfs 의 networks_advanced.aliases) 의 seaweedfs-ext 와 같아야 한다(다르면 해석 실패).
fields:
    - {ref: Service/seaweedfs, path: [spec, type], value: ExternalName}
    - {ref: Service/seaweedfs, path: [spec, externalName], value: seaweedfs-ext}
    - {ref: Service/seaweedfs, path: [metadata, annotations, argocd.argoproj.io/sync-options], value: "Prune=false,Delete=false"}
