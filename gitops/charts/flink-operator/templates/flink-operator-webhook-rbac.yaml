# Flink Operator 보완 RBAC — admission webhook의 클러스터 스코프 조회 권한
#
# 배경: 차트에 `watchNamespaces={default}`를 주면(잡 ns에 `flink` SA·Role을 만들기 위해 필수)
#   오퍼레이터 RBAC이 **전부 네임스페이스 Role로 좁아진다**. 그런데 mutating webhook의
#   `FlinkMutator.mutateSessionJob`은 `FlinkSessionJob`을 받을 때 대상 FlinkDeployment를
#   **클러스터 스코프로 list** 한다(`/apis/flink.apache.org/v1beta1/flinkdeployments?resourceVersion=0`).
#   → 403으로 webhook이 실패하고 `FlinkSessionJob` 생성 자체가 거부된다(2026-08-18 실측).
#
# 최소권한 원칙(conventions/k8s.md §5)에 따라 **읽기 3종(get/list/watch)** 만, **flinkdeployments 한정**으로
# 클러스터 스코프를 보완한다. 쓰기·삭제와 다른 리소스는 차트의 네임스페이스 Role이 그대로 담당한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: flink-operator-webhook-read
rules:
    - apiGroups: ["flink.apache.org"]
      resources: ["flinkdeployments"]
      verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: flink-operator-webhook-read
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: flink-operator-webhook-read
subjects:
    - kind: ServiceAccount
      name: flink-operator
      namespace: flink-operator
