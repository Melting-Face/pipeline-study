# pre-commit 훅: 커밋 시 린터·포매터·시크릿 스캔을 자동 실행 (트렁크 대체)
#
# 설치:
#   uv tool install pre-commit
#   pre-commit install --install-hooks    # pre-commit + commit-msg 훅 설치
# 전체 검사:
#   pre-commit run --all-files
#
# 규칙(룰)의 단일 출처는 pyproject.toml / .yamllint.yaml / .gitleaks.toml 이며,
# 이 파일은 '언제 무엇을 실행할지'만 정의한다. (훅은 스테이징된 파일만 검사)
#
# 사전 준비(hadolint만): `brew install hadolint` — 로컬 바이너리를 직접 호출한다.
#   업스트림의 `hadolint-docker` 훅은 `docker` CLI를 요구하는데 이 머신은 podman만 있다.
#
# 미포함(마찰·의존성으로 당분간 수동 운용):
#   - mypy : 의존성 환경 필요 → repo 루트에서
#            `uv run --project dagster/dockerfile.d/src --with mypy mypy dagster/dockerfile.d/src/src`
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]  # k8s 매니페스트(--- 다중 문서) 허용
      # skills-lock.json·.mcp.json·.claude/settings.json은 손으로 고치는 JSON이라
      # 문법이 깨지면 hook 배선·스킬 재현성이 조용히 죽는다(로드 실패가 에러로 안 보인다).
      - id: check-json
      # gitleaks는 '크리덴셜 패턴'을 잡지 키 파일 자체를 잡지 못한다.
      # .gitignore의 `**/*.pem`·`**/*.key`가 1차, 이 훅이 2차 방어다(확장자 없이 들어온 키).
      - id: detect-private-key

  # Python 린트 + 포맷 (규칙은 pyproject.toml [tool.ruff])
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # YAML 린트 (규칙은 .yamllint.yaml)
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  # SQL 린트 (규칙은 pyproject.toml [tool.sqlfluff.*])
  # templater=jinja + 스텁 매크로/library_path 라 **오프라인**으로 돈다(dbt·Spark Connect 불필요).
  # exclude를 훅에도 거는 이유: pre-commit은 스테이징 경로를 명시 전달하므로
  # .sqlfluffignore만으로 걸러진다는 보장이 없다(ruff force-exclude와 같은 계열).
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      - id: sqlfluff-lint
        exclude: '^initdb/'
      - id: sqlfluff-fix
        exclude: '^initdb/'

  # 셸 스크립트 린트 — scripts/*.sh (k8s 기동·worktree 생성 등 운영 진입점)
  # shellcheck-py는 바이너리를 wheel로 배포해 격리 venv에 들어간다(로컬 설치 불필요).
  # 🔴 `-x`는 선택이 아니다 — 이 저장소의 `scripts/k8s-*.sh`는 전부 `k8s-env.sh`를 source하는데,
  #   pre-commit은 **스테이지된 파일만** 훅에 넘긴다. `-x` 없이는 source 대상이 입력에 없다는 이유로
  #   `SC1091`이 나서 **스크립트 한 개만 커밋하면 게이트가 깨진다**(2026-08-23 실발동으로 확인 —
  #   같은 파일이 `k8s-env.sh`와 함께 넘어가면 통과해, 파일 결함이 아니라 입력 범위 문제였다).
  #   `-x`는 source 대상을 따라가 실제로 검사하므로 커버리지도 함께 넓어진다.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]

  # Dockerfile 린트 (규칙은 .hadolint.yaml)
  # 업스트림 `hadolint-docker`는 `docker` CLI를 요구하는데 이 머신은 podman뿐이라
  # 로컬 바이너리를 직접 부르는 `hadolint` 훅을 쓴다 → `brew install hadolint` 선행.
  # rev를 설치 바이너리와 같은 2.15.1로 맞춘다(훅 정의와 실제 실행본의 버전 혼동 방지).
  # types:[dockerfile]이 Dockerfile.spark-runner·Dockerfile.flink-runner도 잡는 것을 실측 확인.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint

  # 시크릿 스캔 (규칙은 .gitleaks.toml)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # 노트북 셀 출력 제거 — 원천 진료 데이터가 .ipynb에 박제된 채 커밋되는 것을 막는다.
  # gitleaks는 '크리덴셜 패턴'을 잡지 헬스 데이터를 잡지 못하므로 별도 방어가 필요하다.
  # 근거: docs/security.md (원천 데이터 커밋 금지 · DUA)
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # 문서 링크·앵커·볼트 참조 검사 (2026-08-24 신설).
  # 🔴 이 저장소 **최초의 「스크립트를 실행하는」 로컬 훅**이다. 아래 local 훅 2종은
  #    `language: fail`이라 경로 패턴에 걸리면 무조건 실패시킬 뿐 아무것도 실행하지 않는다.
  # 🔴 `uv run`을 쓰지 않는다 — CI `lint` 잡에 **uv가 없다**(`setup-uv`는 `commit-msg`·
  #    `defs` 잡에만 있다). `entry: uv run …`으로 걸면 **로컬만 통과하고 CI에서 죽는다**.
  #    `doc_lint.py`는 PEP 723 `dependencies = []`라 격리 env가 살 것이 없으므로
  #    `language: system` + 호스트 `python3`을 쓴다. 대가: 호스트가 3.10 미만이면
  #    `SyntaxError`로 죽는다 — **조용한 통과가 아니라 fail-loud**라 받아들인다.
  # 🔴 `pass_filenames: false` — `--links`는 `args.paths`를 **읽지도 않는다**(main이 조기
  #    반환). 넘기면 조용히 무시돼 "스테이징분만 본다"는 오해만 남는다. 스코프는 스크립트
  #    상수(`LINK_SCAN_DIRS`)가 갖고 훅은 **언제 도느냐만** 정한다 — 경로 목록을 두 벌 두면
  #    모집단이 갈린다(이 저장소가 반복해 데인 함정).
  # 🔴 `always_run: true` — **링크는 `.md`를 안 건드려도 깨진다**(`scripts/*.py` rename 등).
  #    `files:` 필터를 걸면 그 커밋에 `.md`가 없을 때 훅이 아예 안 돈다. 비용 0.45초.
  #    ✅ 2026-08-24 실증(대조군 → 실험군, 변인 하나): 깨끗한 트리 + 비-md 스테이징 → Passed /
  #    `git mv scripts/journal_guard.py …_x.py` 스테이징(md 0건) → `dead-link` 2건·exit 1.
  # ⚠️ **이 훅이 보는 것은 작업 트리가 아니라 「HEAD + 스테이징분」이다** — pre-commit이
  #    미스테이지 변경을 stash 한 뒤 훅을 돌리기 때문이다. 커밋 게이트로는 이게 맞지만,
  #    **미스테이지 상태로 깨 둔 링크는 이 훅이 못 본다**(첫 프로브가 여기 걸려 "통과"로
  #    오판했다). 손으로 확인할 때는 `python3 scripts/doc_lint.py --links`를 직접 돌려라 —
  #    그쪽은 작업 트리를 본다. 🔴 **두 경로가 세는 모집단이 다르다.**
  # ⚠️ **한계: 볼트 축은 CI에서 「검사 안 함」이다** — `$OBSIDIAN_VAULT`가 러너에 없다.
  #    `doc_lint.py`가 "0건"과 "검사 안 함"을 구분해 출력하니 그 줄을 읽어라.
  #    **CI 초록을 「볼트 참조 정상」으로 읽지 마라.**
  # 근거: docs/conventions/general.md §문서 작성 규약
  - repo: local
    hooks:
      - id: doc-links
        name: 문서 링크·앵커·볼트 참조 검사
        language: system
        entry: python3 scripts/doc_lint.py --links
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # 원천 진료 데이터 **파일** 커밋 차단 (2026-08-22 신설).
  # 🔴 nbstripout은 `.ipynb` 셀 출력만 걷어낸다 — 같은 디렉터리에 `.csv`/`.parquet`를
  #    쓰면 그대로 커밋 대상이었다(실측: `git check-ignore notebooks/out.csv` → 미무시).
  #    gitleaks도 못 잡는다(크리덴셜 패턴이지 헬스 데이터가 아니다).
  # 🔴 `.gitignore`(아래 보조 규칙)와 **역할이 다르다**: gitignore는 실수 스테이징을
  #    조용히 막는 1층이고, 이 훅은 ⓐ `git add -f` 강제 ⓑ **이미 추적 중인 파일**을
  #    잡으며 **차단 사유를 사람에게 말해준다**(gitignore는 "왜 안 올라가지"가 된다).
  # ⚠️ 한계: 모든 게이트가 로컬 pre-commit뿐이라 `--no-verify`·훅 미설치 클론으로
  #    우회된다(서버측 CI 게이트 0개 — docs/security.md). **실수 방지이지 봉쇄가 아니다.**
  # 🔴 `wiki/`를 넣은 이유는 **노출 등급이 가장 높기 때문**이다 — GitHub 위키는 별도
  #    저장소(`<repo>.wiki.git`)로 미러되므로, 여기 데이터 파일이 들어가면 저장소 이력에
  #    남는 것으로 끝나지 않고 **위키에도 복제**된다. 회수 지점이 둘로 늘어난다.
  #    ⚠️ 이 훅이 보는 것은 `wiki/` **원본**까지다 — 미러된 위키 저장소는 어떤 훅도 안 본다.
  # 🔴 **차단 범위는 확장자 ∧ 경로 두 축**이다 — `^(notebooks|docs|wiki)/` **밖**은 통째로 밖이라
  #    저장소 루트의 `out.csv`나 `dbt_pipelines/*.parquet`는 이 훅도 `.gitignore`도 안 잡는다.
  #    duckdb `COPY TO 'out.csv'` 같은 **상대경로 내보내기가 루트에 떨어지는 것**이 그 형태다.
  # 🔴 **이 훅을 프로브할 때 `pre-commit run --files <경로>`의 결과를 그대로 읽지 마라** —
  #    경로가 **실재하지 않으면** 정규식과 무관하게 `(no files to check) Skipped` + exit 0이 난다.
  #    `&& echo 통과` 식으로 판정하면 **모든 셀이 통과로 나온다**(2026-08-24 실제로 그렇게 오판했다).
  #    파일을 실제로 만들고, `Skipped`를 **통과가 아니라 별도 분기**로 세라.
  # 근거: docs/security.md §반출 경로(3. 데이터 반출)
  - repo: local
    hooks:
      - id: no-health-data-files
        name: 원천 진료 데이터 파일 커밋 차단
        language: fail
        entry: >-
          🔴 원천 진료 데이터일 수 있는 데이터 파일이다. 저장소에 커밋하지 않는다 (DUA·재식별 금지).
          반출은 저장소 밖 $DATA_EXTRACT_DIR(기본 ~/extracts)로만 하며 담당은 `data-extractor`다.
          집계·요약만 남기려면 gold 모델이나 리포트 본문으로 옮겨라.
          정본 docs/security.md · 예외가 필요하면 supervisor에 `security` 컨펌을 요청한다.
        files: >-
          ^(notebooks|docs|wiki)/.*\.(csv|tsv|psv|parquet|feather|arrow|orc|avro|xlsx|xls|jsonl|ndjson|pkl|pickle|npy|npz|dta|sas7bdat|db|sqlite|duckdb)$

  # 조사 게이트 런타임 상태 커밋 차단 (2026-08-23 신설).
  # 🔴 `no-health-data-files`와 **같은 형태·다른 대상**이다: `.gitignore`가 1층이고
  #    이 훅이 ⓐ `git add -f` ⓑ 이미 추적 중인 파일을 잡는 2층이다.
  # 🔴 막는 이유는 비밀정보가 아니라 **관측 로그의 성격**이다 — 무엇을 언제 조회했는지가
  #    영구 이력으로 남으면 질의문이 저장소에 박제된다. 감사에는 필요하지만
  #    감사 주체는 `security`이고 그 시점은 G2 한 번이다(수명 = 세션).
  # ⚠️ 한계: 로컬 훅이라 `--no-verify`로 건너뛸 수 있다 — 다만 **거기서 끝이 아니다.**
  #    2026-08-23 서버측 CI(`.github/workflows/ci.yml` `lint` 잡)가 머지돼
  #    `pre-commit run --all-files`를 **저장소 전체**에 다시 돌린다. 🔴 모집단이 다르다 —
  #    로컬 훅은 **스테이징된 파일만**, CI는 **전체**를 본다. 로컬 초록을 서버 초록으로 읽지 마라.
  #    ⇒ `--no-verify`는 **커밋을 통과시킬 뿐 push 이후를 통과시키지 못한다.**
  # 🔴 이 문단 자체가 한 번 낡았다 — 신설 당시(같은 날 오전) *"실수 방지이지 봉쇄가 아니다"* 로
  #    적었는데 몇 시간 뒤 CI가 머지되며 절반이 거짓이 됐다. **한계 서술에도 유효기간이 있다**:
  #    보통은 "통과했다"를 과신하는 것이 위험한데, 여기서는 **한계 문구가 낡아 통제를 과소평가**했다.
  # 근거: docs/conventions/agents.md §researcher 조사 프로토콜
  - repo: local
    hooks:
      - id: no-research-state-files
        name: 조사 게이트 런타임 상태 커밋 차단
        language: fail
        entry: >-
          🔴 `.claude/.research/`는 조사 게이트의 런타임 상태다(승인 URL 목록·질의 로그).
          세션 수명의 관측 기록이라 커밋하지 않는다 — 감사는 `security`가 G2에서 파일을 직접 읽는다.
          승인 이력을 남겨야 하면 미션 저널($OBSIDIAN_VAULT)에 요약해 적어라.
          정본 docs/conventions/agents.md §researcher 조사 프로토콜.
        files: >-
          ^\.claude/\.research/

  # 스킬-워커 배선 정합 검사 (2026-08-24 신설).
  # 🔴 위 `doc-links`와 **같은 형태·다른 대상**이다. 검사 방향은 **워커 → 문서**:
  #    각 `.claude/agents/*.md`의 §참고 스킬 표가 **집행 정본**이고 `docs/skills.md` §③은
  #    파생 인덱스다(런타임에 §③은 워커 컨텍스트에 없다).
  # 🔴 `scripts/skill_gate_guard.py`와 **다른 물건**이다 — 저쪽은 `Skill` 도구 호출을
  #    가로채는 **런타임 차단**(fail-closed `deny`), 이쪽은 **커밋 전 정합**(exit 1)이다.
  #    한쪽이 초록이라고 다른 쪽이 초록인 것이 아니다.
  # 🔴 `pass_filenames: false` — 이 검사는 **두 집합의 대조**라 한쪽 파일만 받아서는
  #    판정이 성립하지 않는다. `files:`는 **트리거일 뿐 스코프가 아니다**(스코프는
  #    스크립트가 글롭한다) — 그래서 목록이 두 벌이 되지 않는다.
  # ⚠️ `.claude/skills/`는 gitignore라 스테이징되지 않는다 ⇒ 디스크 설치분만 바뀌면
  #    이 훅은 안 돈다. 실재성(R6)은 커밋 축이 아니라 **감사 축**(`skill-matcher`)에서도 본다.
  # 근거: docs/skills.md §③ · docs/doc-sync.md
  - repo: local
    hooks:
      - id: skill-wiring
        name: 워커 지시문 ↔ skills.md §③ 배선 정합
        language: system
        entry: python3 scripts/skill_wiring_check.py
        pass_filenames: false
        files: '^(\.claude/agents/.*\.md|docs/skills\.md|docs/skills/.*\.md|skills-lock\.json)$'
        stages: [pre-commit]

  # 문서 가독성 규약 검사 (2026-08-24 신설 — 위반 0건이 된 뒤에 건다).
  # 🔴 **초록인 시점에만 건다.** 이 훅은 위 두 훅보다 늦게 등록됐다 — 신설 당시 위반이
  #    50건이라, 먼저 걸었으면 그 뒤 **모든 문서 커밋이 막혔을** 것이다.
  #    line-length 26 · table-cell 19 · emphasis 6 · file-length 1을 전부 해소한 뒤 등록한다.
  # 🔴 `pass_filenames: false` — 파일명을 넘기면 스코프가 **스테이징분**이 되어 스크립트의
  #    상수와 갈린다. 그러면 아래 `files:`가 그 상수의 **두 번째 사본**이 된다.
  #    스코프는 상수 한 곳에 둔다.
  # ⚠️ **모집단을 오해하지 마라 — 이 훅 하나가 축마다 다른 모집단을 돈다.**
  #    · 가독성 4축·시제 → `DEFAULT_TARGETS`
  #    · **일자 축 → `DATE_TARGETS`**(위 + `.claude/agents/**`)
  #    · 링크·앵커 → 위 `doc-links` 훅의 `LINK_SCAN_DIRS`
  #    **셋 다 다르다.** ⇒ `.claude/agents/**`는 **일자·링크는 검사받지만 가독성 4축은
  #    안 받는다**(강조·줄 길이·표 셀 위반이 실재한다). 워커 지시문의 🔴는 매 배정마다
  #    컨텍스트에 실리는 **단서 표식**이라 `docs/`의 강조와 목적이 다르고, 넓히면
  #    13개 중 10개가 즉시 위반이다 — **전원이 매번 위반하는 규칙은 규칙이 아니다.**
  #    스크립트가 꼬리에 `가독성·시제 N개 · 일자 M개`를 따로 찍으니 **그 줄을 읽어라**
  #    (한 숫자로 적으면 그 자체가 거짓이 된다).
  #    정본은 docs/doc-sync.md §변경 유형별 동기화 체인의 3목록 표.
  # 🔴 **게이트를 강화하는 커밋은 자기 자신을 막을 수 있다.** 없던 검사를 켜면 기존
  #    커밋분에서 위반이 솟아나는데 그것은 어느 작업물도 아니라 **소유자가 없다.**
  #    ⇒ 강화 전에 전수 스캔으로 **깨어날 위반을 먼저 세고 같은 커밋에서 치운다.**
  # 근거: docs/conventions/general.md §문서 작성 규약
  - repo: local
    hooks:
      - id: doc-lint
        name: 문서 가독성 규약 (줄 길이·표 셀·강조·문서 길이)
        language: system
        entry: python3 scripts/doc_lint.py
        pass_filenames: false
        files: '\.md$'
        stages: [pre-commit]

  # Terraform 포매터 — conventions/terraform.md §3이 요구하던 게이트의 집행 수단
  # (규약은 있었으나 훅이 없어 terraform/oci-k3s 는 한 번도 검사받은 적이 없었다).
  #
  # 🔴 **`terraform_validate`는 여기 넣지 않는다.** `validate`는 `init`이 선행돼야 하는데
  #    `.terraform/providers`는 gitignore라 저장소에 없다. 훅에서 `init`을 돌리면
  #    **커밋이 프로바이더 레지스트리 가용성에 묶인다.** 이 저장소는 같은 함정을
  #    `sqlfluff`의 `templater = "dbt"`에서 이미 겪었다 — 커밋이 Spark Connect 가용성에
  #    묶여 게이트로 쓸 수 없었고, 그래서 22개 모델이 오래 무검사로 남았다.
  #    ⇒ `validate`는 **CI 잡**이 진다(.github/workflows/ci.yml 의 `terraform`).
  #    2026-08-28 실측: worktree에서 `terraform validate` 가
  #    `no package for oracle/oci 6.37.0 cached in .terraform/providers` 로 실패했다.
  #
  # `fmt`는 네트워크가 필요 없어 로컬 게이트로 적합하다. 2-space는 terraform의 정규
  # 포맷이며 전역 4칸 규칙의 **의도된 예외**다(conventions/terraform.md §3).
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.0
    hooks:
      - id: terraform_fmt

  # 커밋 메시지 Conventional Commits 검사 (규칙은 루트 .gitlint)
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
